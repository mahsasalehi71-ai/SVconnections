<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایشگاه تعاملی حجم و مساحت</title>
<style>
:root {
  color-scheme: light;
  --ink: #142b31;
  --muted: #4a6268;
  --accent: #006858;
  --accent-hover: #005143;
  --line: #d5e4e1;
  --wash: #edf6f3;
  --paper: #fff;
  --background: #f3f8f6;
  font-family: "Vazirmatn", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
  line-height: 1.65;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--background); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible {
  outline: 3px solid #008674;
  outline-offset: 3px;
}
[hidden] { display: none !important; }

.shell-header { background: var(--paper); border-bottom: 1px solid var(--line); }
.header-inner {
  width: min(1160px, 100% - 40px);
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-inline: auto;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.brand-icon {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 11px; background: var(--accent); color: white;
  font: 700 24px/1 Arial, sans-serif;
}
.author { color: var(--muted); font-size: 0.94rem; margin: 0; }
.home { width: min(1160px, 100% - 40px); margin: clamp(36px, 7vh, 84px) auto 44px; }
.hero {
  padding: clamp(28px, 5vw, 60px);
  color: white;
  background: radial-gradient(ellipse at 12% 10%, #1b6b5d, transparent 66%), #103a35;
  border-radius: 26px;
}
.hero h1 { font-size: clamp(2.1rem, 5vw, 4rem); line-height: 1.38; margin: 0; }
.hero p { color: #d8eeea; font-size: clamp(1.05rem, 2vw, 1.22rem); margin: 14px 0 0; }
h2 { font-size: clamp(1.4rem, 2.8vw, 1.75rem); margin: 32px 0 14px; }
.shapes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.shape-card {
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
  padding: 8px;
  text-align: start;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 4px 15px #173d3009;
}
.shape-card:hover { border-color: var(--accent); box-shadow: 0 5px 18px #173d3019; }
.shape-preview { display: block; width: 100%; height: auto; background: var(--tile); border-radius: 11px; }
.shape-name {
  display: flex; align-items: center; justify-content: space-between; gap: 5px;
  padding: 12px 5px 8px;
  font-size: clamp(1rem, 1.65vw, 1.22rem); font-weight: 700;
}
.shape-name span { color: var(--accent); }
.back {
  min-height: 44px; padding: 6px 14px; color: var(--accent);
  background: var(--wash); border: 1px solid var(--line); border-radius: 11px;
  font-weight: 700;
}
.back:hover { background: #e0f0eb; }
.lab-active .author { display: none; }
.lab-active { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
iframe { display: block; width: 100%; height: 100%; border: 0; }
@media (max-width: 820px) { .shapes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 525px) {
  .header-inner, .home { width: calc(100% - 28px); }
  .header-inner { min-height: 64px; gap: 8px; }
  .brand-icon { display: none; }
  .author { font-size: 0.84rem; }
  .hero { border-radius: 20px; }
  .shapes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}

</style>
</head>
<body>
<header class="shell-header">
  <div class="header-inner">
    <span class="brand"><span class="brand-icon" aria-hidden="true">∠</span>آزمایشگاه ریاضیات</span>
    <p class="author">طراح مهسا صالحی</p>
    <button type="button" id="backBtn" class="back" hidden>بازگشت به شکل‌ها <span aria-hidden="true">↵</span></button>
  </div>
</header>
<main class="home" id="home">
  <section class="hero">
    <h1>آزمایشگاه حجم و مساحت</h1>
    <p>ابعاد شکل را تغییر بده و ببین مساحت و حجم آن چطور عوض می‌شود.</p>
  </section>
  <h2>یک شکل انتخاب کن</h2>
  <div class="shapes">
    <button type="button" class="shape-card" data-shape="pyramid" data-name="هرم منتظم">
      <canvas class="shape-preview" width="304" height="200" style="--tile:#e7f3ec" aria-hidden="true"></canvas>
      <span class="shape-name">هرم منتظم<span aria-hidden="true">←</span></span>
    </button>
<button type="button" class="shape-card" data-shape="prism" data-name="منشور منتظم">
      <canvas class="shape-preview" width="304" height="200" style="--tile:#e3f1f1" aria-hidden="true"></canvas>
      <span class="shape-name">منشور منتظم<span aria-hidden="true">←</span></span>
    </button>
<button type="button" class="shape-card" data-shape="cube" data-name="مکعب‌مستطیل">
      <canvas class="shape-preview" width="304" height="200" style="--tile:#eaf2e7" aria-hidden="true"></canvas>
      <span class="shape-name">مکعب‌مستطیل<span aria-hidden="true">←</span></span>
    </button>
<button type="button" class="shape-card" data-shape="cylinder" data-name="استوانه">
      <canvas class="shape-preview" width="304" height="200" style="--tile:#e6f1f5" aria-hidden="true"></canvas>
      <span class="shape-name">استوانه<span aria-hidden="true">←</span></span>
    </button>
<button type="button" class="shape-card" data-shape="cone" data-name="مخروط">
      <canvas class="shape-preview" width="304" height="200" style="--tile:#e8f2ea" aria-hidden="true"></canvas>
      <span class="shape-name">مخروط<span aria-hidden="true">←</span></span>
    </button>
  </div>
</main>
<iframe id="viewer" title="نمای آزمایشگاه" hidden></iframe>
<script type="text/plain" id="labStyles">
:root {
  color-scheme: light;
  --ink: #142b31;
  --muted: #4a6268;
  --accent: #006858;
  --accent-hover: #005143;
  --line: #d5e4e1;
  --wash: #edf6f3;
  --paper: #fff;
  --background: #f3f8f6;
  font-family: "Vazirmatn", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
  line-height: 1.65;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--background); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible {
  outline: 3px solid #008674;
  outline-offset: 3px;
}
[hidden] { display: none !important; }

body { padding: clamp(12px, 3vw, 30px); }
.container { max-width: 1160px; margin-inline: auto; }
h1 { font-size: clamp(1.75rem, 4vw, 2.65rem); margin: 0 0 16px; line-height: 1.45; }
h2 { font-size: 1.2rem; margin: 0 0 12px; }
.two-columns {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(290px, 0.82fr);
  grid-template-areas: "drawing controls";
  gap: clamp(12px, 2vw, 22px);
  align-items: start;
}
.input-panel, .drawing-panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: clamp(12px, 2vw, 20px);
  background: var(--paper);
}
.input-panel { grid-area: controls; }
.drawing-panel { grid-area: drawing; }
.input-group { margin-bottom: 12px; }
label { display: block; font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
input, select {
  width: 100%; min-height: 46px; padding: 7px 11px;
  border: 1px solid #a9c3bd; border-radius: 10px;
  background: #f8fbfa; color: var(--ink);
}
input[type=number] { direction: ltr; text-align: right; }
input:disabled { background: #e9efed; color: #425c57; }
.btn-group, .view-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-group { margin: 14px 0 20px; }
.btn-group button, .view-btn {
  min-height: 46px; padding: 7px 6px; border: 1px solid transparent;
  border-radius: 10px; font-weight: 700; text-align: center;
}
.btn-primary, .view-btn.btn-active { background: var(--accent); color: white; }
.btn-primary:hover, .view-btn.btn-active:hover { background: var(--accent-hover); }
.btn-group .btn-secondary { background: var(--wash); color: var(--accent); border-color: var(--line); }
.btn-secondary:hover, .view-btn:hover { background: #e1efeb; }
.view-toggle { padding: 5px; margin-bottom: 12px; border-radius: 13px; background: var(--wash); }
.view-btn { background: transparent; color: var(--ink); }
.canvas-container {
  display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; padding: 5px;
  border-radius: 13px;
  background: radial-gradient(circle at 50% 24%, #243a50, #101d2f 62%, #0b1626);
}
#mainCanvas {
  max-width: 100%; height: auto !important;
  display: block; border-radius: 9px; cursor: grab; touch-action: none;
}
#mainCanvas:active { cursor: grabbing; }
.info-text { margin: 10px 0 0; font-size: 0.97rem; color: var(--muted); }
.results-panel { background: var(--wash); padding: 10px 12px; border-radius: 13px; }
.result-item {
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 0 8px; padding: 8px 0;
}
.result-item + .result-item { border-top: 1px solid #cddfda; }
.result-label { font-size: 1rem; font-weight: 700; }
.result-value {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 5px;
  direction: ltr; text-align: left; color: var(--accent);
  font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere;
}
.unit { font-size: 0.92rem; white-space: nowrap; }
.formula-text {
  flex-basis: 100%; direction: ltr; unicode-bidi: plaintext;
  font-size: 0.95rem; font-weight: 400; color: var(--muted);
}
#dimensions { font-size: 0.98rem; direction: ltr; unicode-bidi: plaintext; }
@media (max-width: 740px) {
  .two-columns { grid-template-columns: minmax(0, 1fr); grid-template-areas: "drawing" "controls"; }
}


.canvas-container {
  background-color: #10253a;
  background-image: radial-gradient(circle at center, #18395288, transparent 75%),
    linear-gradient(#a1bcd214 1px, transparent 1px),
    linear-gradient(90deg, #a1bcd214 1px, transparent 1px);
  background-size: auto, 24px 24px, 24px 24px;
}
.display-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 14px; margin-top: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; list-style: none; padding: 0; margin: 0; font-size: 0.92rem; color: var(--muted); }
.legend li { display: inline-flex; gap: 6px; align-items: center; }
.legend li[hidden] { display: none; }
.swatch { display: inline-block; width: 15px; height: 15px; border: 1px solid #163247; border-radius: 4px; }
.swatch.base { background: #f4bc69; }
.swatch.side { background: #66c6e9; }
.swatch.box-side { background: linear-gradient(90deg, #66c6e9 50%, #83d0b4 50%); }
.swatch.fold { width: 19px; height: 0; border: 0; border-top: 2px dashed var(--ink); border-radius: 0; }
.reset-view { margin-inline-start: auto; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; color: var(--accent); background: var(--wash); font-weight: 700; }
.reset-view:hover { background: #e1efeb; }
</script>
<template id="pyramid">
<div class="container">
        <h1>هرم منتظم</h1>
        <div class="main-card">
            <div class="two-columns">
                <div class="drawing-panel">
                    <div class="view-toggle"><button id="showNetBtn" aria-pressed="true" class="view-btn btn-active">گسترده</button><button id="show3DBtn" aria-pressed="false" class="view-btn">نمای سه‌بعدی</button></div>
                    <div class="canvas-container"><canvas id="mainCanvas" tabindex="0" role="img" aria-label="نمای هندسی شکل" aria-describedby="viewLabel" width="600" height="480"></canvas></div>
                    
                    <div class="display-tools">
                        <ul class="legend" aria-label="راهنمای رنگ‌ها و خطوط">
                            <li><span class="swatch base" aria-hidden="true"></span>قاعده</li>
                            <li><span class="swatch side" aria-hidden="true"></span>سطح جانبی</li>
                            <li id="foldKey"><span class="swatch fold" aria-hidden="true"></span>خط تا</li>
                        </ul>
                        <button type="button" class="reset-view" id="resetView">بازنشانی نما</button>
                    </div>
                    <p class="info-text" id="viewLabel">قاعده در مرکز و مثلث‌ها در اطراف آن قرار دارند.</p>
                </div>
                <div class="input-panel"><h2>ابعاد شکل</h2>
                    <div class="input-group">
                        <label for="sidesCount">نوع هرم</label>
                        <select id="sidesCount">
                            <option value="3">3 - هرم سه‌ضلعی (قاعده مثلث)</option>
                            <option value="tetra" selected>⚡ ۴ وجه منتظم (چهاروجهی - همه مثلث متساوی‌الاضلاع)</option>
                            <option value="4">4 - هرم چهارضلعی (قاعده مربع)</option>
                            <option value="5">5 - هرم پنج‌ضلعی</option>
                            <option value="6">6 - هرم شش‌ضلعی</option>
                            <option value="7">7 - هرم هفت‌ضلعی</option>
                            <option value="8">8 - هرم هشت‌ضلعی</option>
                        </select>
                    </div>
                    <div class="input-group"><label for="sideLength">طول ضلع قاعده (a)</label><input type="number" id="sideLength" value="6" step="any"></div>
                    <div class="input-group"><label for="height">ارتفاع هرم (h)</label><input type="number" id="height" value="8" step="any"></div>
                    <div class="btn-group"><button id="updateBtn" class="btn-primary">محاسبه</button><button id="resetBtn" class="btn-secondary">بازنشانی</button></div>
                    <div class="results-panel" aria-live="polite"><h2>نتایج محاسبه</h2>
                        <div class="result-item"><span class="result-label">مساحت کل</span><span class="result-value"><span id="totalArea">0</span><span class="unit">cm²</span></span><span class="formula-text">(مساحت قاعده + مساحت جانبی)</span></div>
                        <div class="result-item"><span class="result-label">مساحت جانبی</span><span class="result-value"><span id="lateralArea">0</span><span class="unit">cm²</span></span><span class="formula-text">(n × ½ × a × ارتفاع مثلث جانبی)</span></div>
                        <div class="result-item"><span class="result-label">حجم</span><span class="result-value"><span id="volume">0</span><span class="unit">cm³</span></span><span class="formula-text">(⅓ × مساحت قاعده × h)</span></div>
                        <div class="result-item"><span class="result-label">مشخصات</span><span class="result-value"><span id="dimensions"></span></span></div>
                    </div>
                    <p class="info-text">در چهاروجهی منتظم، ارتفاع به‌صورت خودکار محاسبه می‌شود.</p>
                </div>
            </div>
        </div>
    </div>
<script>
        (function() {
            // عناصر DOM
            const sidesSelect = document.getElementById('sidesCount');
            const sideInput = document.getElementById('sideLength');
            const heightInput = document.getElementById('height');
            const updateBtn = document.getElementById('updateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const totalAreaSpan = document.getElementById('totalArea');
            const lateralAreaSpan = document.getElementById('lateralArea');
            const volumeSpan = document.getElementById('volume');
            const dimensionsSpan = document.getElementById('dimensions');
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const showNetBtn = document.getElementById('showNetBtn');
            const show3DBtn = document.getElementById('show3DBtn');
            const viewLabel = document.getElementById('viewLabel');
            
            let currentView = 'net';
            let netOffsetX = 0, netOffsetY = 0;
            let isDragging = false;
            let lastDragX = 0, lastDragY = 0;
            
            // متغیرهای چرخش سه بعدی با ماوس
            let rotationY = -0.65;   // چرخش حول محور Y
            let rotationX = -0.38;    // چرخش حول محور X
            let isDragging3D = false;
            let lastDragX3D = 0, lastDragY3D = 0;
            
            // ارتفاع چهاروجهی منتظم از روی ضلع: h = a * √(2/3)
            function getTetrahedronHeight(a) {
                return a * Math.sqrt(2/3);
            }
            
            // دریافت مقادیر ورودی (با پشتیبانی از چهاروجهی منتظم)
            function getValues() {
                let type = sidesSelect.value;
                let n;
                let a = parseFloat(sideInput.value);
                let h = parseFloat(heightInput.value);
                
                if (isNaN(a) || a <= 0) a = 6;
                
                if (type === 'tetra') {
                    n = 3;
                    const correctH = getTetrahedronHeight(a);
                    if (Math.abs(h - correctH) > 0.001 || isNaN(h) || h <= 0) {
                        h = correctH;
                        heightInput.value = h.toFixed(6);
                    }
                } else {
                    n = parseInt(type);
                    if (isNaN(n) || n < 3) n = 4;
                    if (isNaN(h) || h <= 0) h = 8;
                }
                
                const R = a / (2 * Math.sin(Math.PI / n));
                const L = Math.sqrt(h * h + R * R);
                
                return { n, a, h, L, R, isTetra: (type === 'tetra') };
            }
            
            // مساحت چندضلعی منتظم
            function polygonArea(n, a) {
                if (n < 3) return 0;
                return (n * a * a) / (4 * Math.tan(Math.PI / n));
            }
            
            // ارتفاع مثلث جانبی (با استفاده از یال و نصف ضلع قاعده)
            function getSlantHeight(L, a) {
                return Math.sqrt(L * L - (a/2) * (a/2));
            }
            
            // محاسبات مساحت و حجم
            function calculateAndUpdate() {
                let { n, a, h, L, R, isTetra } = getValues();
                const areaBase = polygonArea(n, a);
                const slantHeight = getSlantHeight(L, a);
                const lateralArea = n * 0.5 * a * slantHeight;
                const totalArea = areaBase + lateralArea;
                const volume = (1/3) * areaBase * h;
                
                totalAreaSpan.innerText = totalArea.toFixed(2);
                lateralAreaSpan.innerText = lateralArea.toFixed(2);
                volumeSpan.innerText = volume.toFixed(2);
                
                if (isTetra) {
                    dimensionsSpan.innerHTML = `چهاروجهی منتظم (همه وجه‌ها مثلث متساوی‌الاضلاع) | a=${a.toFixed(2)}, h=${h.toFixed(3)}`;
                } else {
                    dimensionsSpan.innerHTML = `n=${n}, a=${a.toFixed(2)}, h=${h.toFixed(2)}, یال جانبی=${L.toFixed(2)}`;
                }
                
                return { n, a, h, L, R, isTetra, areaBase, slantHeight };
            }
            
            function rotatePoint3D(x, y, z) {
                const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
                const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y2 = y * cosX - z1 * sinX;
                let z2 = y * sinX + z1 * cosX;
                return { x: x1, y: y2, z: z2 };
            }

            function drawNet() {
                geometryDisplay.drawNet(ctx, canvas.width, canvas.height, 'pyramid', getValues(),
                    { x: netOffsetX, y: netOffsetY });
            }

            function draw3D() {
                geometryDisplay.drawSolid(ctx, canvas.width, canvas.height, 'pyramid', getValues(), rotatePoint3D);
            }

            function autoUpdateForTetra() {
                let type = sidesSelect.value;
                let a = parseFloat(sideInput.value);
                if (type === 'tetra' && !isNaN(a) && a > 0) {
                    const correctH = getTetrahedronHeight(a);
                    heightInput.value = correctH.toFixed(6);
                }
                refresh();
            }
            
            function refresh() {
                calculateAndUpdate();
                if (currentView === 'net') drawNet();
                else draw3D();
            }
            
            function setupCanvas() {
                const container = canvas.parentElement;
                if (!container) return;
                const containerWidth = container.clientWidth - 10;
                canvas.width = Math.min(containerWidth, 700);
                canvas.height = canvas.width * 0.72;
                canvas.style.width = `${canvas.width}px`;
                canvas.style.height = `${canvas.height}px`;
                refresh();
            }
            
            function setView(view) {
                currentView = view;
                showNetBtn.setAttribute('aria-pressed', String(view === 'net'));
                document.getElementById('foldKey').hidden = view === '3d';
                show3DBtn.setAttribute('aria-pressed', String(view === '3d'));
                if (view === 'net') {
                    showNetBtn.classList.add('btn-active');
                    show3DBtn.classList.remove('btn-active');
                    viewLabel.innerText = 'قاعده در مرکز و مثلث‌ها در اطراف آن قرار دارند.';
                    netOffsetX = 0;
                    netOffsetY = 0;
                    canvas.style.cursor = 'grab';
                    refresh();
                } else {
                    show3DBtn.classList.add('btn-active');
                    showNetBtn.classList.remove('btn-active');
                    viewLabel.innerText = 'برای چرخاندن شکل، تصویر را بکشید یا از کلیدهای جهت‌دار استفاده کنید.';
                    canvas.style.cursor = 'grab';
                    refresh();
                }
            }
            
            // رویدادهای چرخش سه بعدی
            function handle3DDragStart(e) {
                if (currentView !== '3d') return;
                isDragging3D = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX3D = clientX;
                lastDragY3D = clientY;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            }
            
            function handle3DDragMove(e) {

    (function() {
        const sidesSelect = document.getElementById('sidesCount');
        const sideInput = document.getElementById('sideLength');
        const heightInput = document.getElementById('height');
        const updateBtn = document.getElementById('updateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalAreaSpan = document.getElementById('totalArea');
        const lateralAreaSpan = document.getElementById('lateralArea');
        const volumeSpan = document.getElementById('volume');
        const dimensionsSpan = document.getElementById('dimensions');
        const canvas = document.getElementById('mainCanvas');

        const showNetBtn = document.getElementById('showNetBtn');
        const show3DBtn = document.getElementById('show3DBtn');
        const viewLabel = document.getElementById('viewLabel');

        let currentView = 'net';
        let netOffsetX = 0, netOffsetY = 0;
        let isDragging = false;
        let lastDragX = 0, lastDragY = 0;
        
        let rotationY = -0.65;
        let rotationX = -0.38;
        let isDragging3D = false;
        let lastDragX3D = 0, lastDragY3D = 0;

            let n = parseInt(sidesSelect.value);

            let h = parseFloat(heightInput.value);

            if (isNaN(a) || a <= 0) a = 4;
            if (isNaN(h) || h <= 0) h = 5;
            return { n, a, h };
        }

        function polygonArea(n, a) {
            if (n < 3) return 0;
            return (n * a * a) / (4 * Math.tan(Math.PI / n));
        }

        function calculateAndUpdate() {
            let { n, a, h } = getValues();
            const areaBase = polygonArea(n, a);
            const perimeter = n * a;
            const lateral = perimeter * h;
            const total = 2 * areaBase + lateral;
            const volume = areaBase * h;
            totalAreaSpan.innerText = total.toFixed(2);
            lateralAreaSpan.innerText = lateral.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            dimensionsSpan.innerText = `n=${n}, a=${a.toFixed(2)}, h=${h.toFixed(2)}`;
            return { n, a, h, areaBase, perimeter };
        }

        function rotatePoint3D(x, y, z) {
            const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
            let x1 = x * cosY + z * sinY;
            let z1 = -x * sinY + z * cosY;
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;
            return { x: x1, y: y2, z: z2 };
        }

        function drawNet() {
            geometryDisplay.drawNet(ctx, canvas.width, canvas.height, 'prism', getValues(),

            lastDragX3D = clientX;
            lastDragY3D = clientY;

            rotationX = Math.max(-1.57, Math.min(1.57, rotationX));
            
            lastDragX3D = clientX;
            lastDragY3D = clientY;
            draw3D();
            e.preventDefault();
        }
        
        function handle3DDragEnd() {
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }
        
        function onDragStart(e) {
            if (currentView !== 'net') return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX = clientX;
            lastDragY = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';

            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            netOffsetX += clientX - lastDragX;
            netOffsetY += clientY - lastDragY;

            const limitX = canvas.width * 0.22;
            const limitY = canvas.height * 0.22;
            netOffsetX = Math.max(-limitX, Math.min(limitX, netOffsetX));
            netOffsetY = Math.max(-limitY, Math.min(limitY, netOffsetY));
            
            lastDragX = clientX;
            lastDragY = clientY;
            drawNet();
            e.preventDefault();
        }
        
        function onDragEnd() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }
        
        function onPointerDown(e) {
            if (currentView === 'net') onDragStart(e);
            else if (currentView === '3d') handle3DDragStart(e);
        }
        
        function onPointerMove(e) {
            if (currentView === 'net') onDragMove(e);

        }

        heightInput.addEventListener('input', refresh);

            sidesSelect.value = "6";
            sideInput.value = "4";
            heightInput.value = "5";
            netOffsetX = 0;
            netOffsetY = 0;
            rotationY = -0.65;
            rotationX = -0.38;
            refresh();
        });
        showNetBtn.addEventListener('click', () => setView('net'));
        show3DBtn.addEventListener('click', () => setView('3d'));
        

        const resetView = document.getElementById('resetView');
        resetView.addEventListener('click', () => {
            netOffsetX = netOffsetY = 0;
            rotationX = -0.38;
            rotationY = -0.65;
            refresh();
        });
        canvas.addEventListener('keydown', event => {
            const steps = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
            const step = steps[event.key];
            if (!step) return;
            event.preventDefault();

            if (currentView === '3d') {
                rotationY += x * 0.14;
                rotationX = Math.max(-1.5, Math.min(1.5, rotationX + y * 0.14));

        });

        setView('net');
    })();
</script>

<script>
    (function () {
        // --- عناصر DOM ---
        const radiusInput = document.getElementById('radius');
        const heightInput = document.getElementById('height');
        const updateBtn = document.getElementById('updateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalAreaSpan = document.getElementById('totalArea');
        const lateralAreaSpan = document.getElementById('lateralArea');
        const volumeSpan = document.getElementById('volume');
        const dimensionsSpan = document.getElementById('dimensions');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const showNetBtn = document.getElementById('showNetBtn');
        const show3DBtn = document.getElementById('show3DBtn');
        const viewLabel = document.getElementById('viewLabel');

        // --- وضعیت نما ---
        let currentView = 'net';      // 'net' or '3d'
        let netOffsetX = 0, netOffsetY = 0;
        let isDragging = false;
        let lastDragX = 0, lastDragY = 0;

        // --- وضعیت چرخش سه بعدی (مشابه هرم) ---
        let rotationY = -0.65;    // چرخش حول محور Y
        let rotationX = -0.38;     // چرخش حول محور X
        let isDragging3D = false;
        let lastDragX3D = 0, lastDragY3D = 0;

        // --- توابع کمکی ---
        function getValues() {
            let r = parseFloat(radiusInput.value);
            let h = parseFloat(heightInput.value);
            if (isNaN(r) || r <= 0) r = 5;
            if (isNaN(h) || h <= 0) h = 8;
            return {r, h};
        }

        function calculateAndUpdate() {
            let {r, h} = getValues();
            const areaBase = Math.PI * r * r;
            const lateralArea = 2 * Math.PI * r * h;
            const totalArea = 2 * areaBase + lateralArea;
            const volume = areaBase * h;
            totalAreaSpan.innerText = totalArea.toFixed(2);
            lateralAreaSpan.innerText = lateralArea.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}`;
            return {r, h, areaBase};
        }

        // ========== 1. نمای گسترده (Net) ==========
        function rotatePoint3D(x, y, z) {
            const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);

            // چرخش حول محور Y
            let x1 = x * cosY + z * sinY;
            let z1 = -x * sinY + z * cosY;

            // چرخش حول محور X
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            return {x: x1, y: y2, z: z2};
        }

        function drawNet() {
            geometryDisplay.drawNet(ctx, canvas.width, canvas.height, 'cylinder', getValues(),
                { x: netOffsetX, y: netOffsetY });
        }

        function draw3D() {
            geometryDisplay.drawSolid(ctx, canvas.width, canvas.height, 'cylinder', getValues(), rotatePoint3D);
        }

        function refresh() {
            calculateAndUpdate();
            if (currentView === 'net') {
                drawNet();
            } else {
                draw3D();
            }
        }

        // ========== مدیریت canvas و رویدادها ==========
        function setupCanvas() {
            const container = canvas.parentElement;
            if (!container) return;
            const containerWidth = container.clientWidth - 10;
            canvas.width = Math.min(containerWidth, 700);
            canvas.height = canvas.width * 0.72;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            refresh();
        }

        function setView(view) {
            currentView = view;
            showNetBtn.setAttribute('aria-pressed', String(view === 'net'));
            show3DBtn.setAttribute('aria-pressed', String(view === '3d'));

                showNetBtn.classList.add('btn-active');

                showNetBtn.classList.remove('btn-active');

                canvas.style.cursor = 'grab';
            }
            refresh();
        }

        // --- رویدادهای درگ برای گسترده (NET) ---
        function handleNetDragStart(e) {
            if (currentView !== 'net') return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX = clientX;
            lastDragY = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }

        function handleNetDragMove(e) {
            if (!isDragging || currentView !== 'net') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            netOffsetX += clientX - lastDragX;
            netOffsetY += clientY - lastDragY;
            lastDragX = clientX;
            lastDragY = clientY;
            drawNet();
            e.preventDefault();
        }

        function handleNetDragEnd() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        // --- رویدادهای چرخش برای نمای سه بعدی (مشابه هرم) ---
        function handle3DDragStart(e) {
            if (currentView !== '3d') return;
            isDragging3D = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX3D = clientX;
            lastDragY3D = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }

        function handle3DDragMove(e) {
            if (!isDragging3D || currentView !== '3d') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - lastDragX3D;
            const dy = clientY - lastDragY3D;

            rotationY += dx * 0.008;
            rotationX += dy * 0.008;

            // محدودیت برای جلوگیری از چرخش بیش از حد
            rotationX = Math.max(-1.4, Math.min(1.4, rotationX));

            lastDragX3D = clientX;
            lastDragY3D = clientY;
            draw3D();
            e.preventDefault();
        }

        function handle3DDragEnd() {
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }

        // توزیع رویدادها بر اساس نما
        function onPointerDown(e) {
            if (currentView === 'net') handleNetDragStart(e);
            else if (currentView === '3d') handle3DDragStart(e);
        }

        function onPointerMove(e) {
            if (currentView === 'net') handleNetDragMove(e);
            else if (currentView === '3d') handle3DDragMove(e);
        }

        function onPointerUp(e) {
            if (currentView === 'net') handleNetDragEnd(e);
            else if (currentView === '3d') handle3DDragEnd(e);
        }

        // ثبت رویدادها
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        // رویدادهای ورودی
        radiusInput.addEventListener('input', refresh);
        heightInput.addEventListener('input', refresh);
        updateBtn.addEventListener('click', refresh);
        resetBtn.addEventListener('click', () => {
            radiusInput.value = "5";
            heightInput.value = "8";
            netOffsetX = 0;
            netOffsetY = 0;
            rotationY = -0.65;
            rotationX = -0.38;
            refresh();
        });
        showNetBtn.addEventListener('click', () => setView('net'));
        show3DBtn.addEventListener('click', () => setView('3d'));


        const resetView = document.getElementById('resetView');
        resetView.addEventListener('click', () => {
            netOffsetX = netOffsetY = 0;
            rotationX = -0.38;
            rotationY = -0.65;
            refresh();
        });
        canvas.addEventListener('keydown', event => {
            const steps = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
            const step = steps[event.key];
            if (!step) return;
            event.preventDefault();
            const [x, y] = step;
            if (currentView === '3d') {
                rotationY += x * 0.14;
                rotationX = Math.max(-1.5, Math.min(1.5, rotationX + y * 0.14));
            } else {
                netOffsetX = Math.max(-canvas.width * 0.3, Math.min(canvas.width * 0.3, netOffsetX + x * 12));
                netOffsetY = Math.max(-canvas.height * 0.3, Math.min(canvas.height * 0.3, netOffsetY + y * 12));
            }
            refresh();
        });

        window.addEventListener('resize', () => setTimeout(setupCanvas, 100));
        setupCanvas();
        setView('net');
    })();
</script>

<script>
    (function(){
        const radiusInput = document.getElementById('radius');
        const heightInput = document.getElementById('height');
        const slantInput = document.getElementById('slant');
        const updateBtn = document.getElementById('updateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalAreaSpan = document.getElementById('totalArea');
        const lateralAreaSpan = document.getElementById('lateralArea');
        const volumeSpan = document.getElementById('volume');
        const dimensionsSpan = document.getElementById('dimensions');
        const canvas = document.getElementById('mainCanvas');

        const showNetBtn = document.getElementById('showNetBtn');

        let lastDragX = 0, lastDragY = 0;

        let lastDragX3D = 0, lastDragY3D = 0;

        function getValues() {
            let r = parseFloat(radiusInput.value);
            let h = parseFloat(heightInput.value);
            let L = parseFloat(slantInput.value);
            if (isNaN(r) || r <= 0) r = 5;
            if (isNaN(h) || h <= 0) h = 12;
            if (isNaN(L) || L <= 0) {
                L = Math.sqrt(r*r + h*h);
                slantInput.value = L.toFixed(2);
            }
            return { r, h, L };
        }

        function calculateAndUpdate() {
            let { r, h, L } = getValues();

            const lateral = Math.PI * r * L;

            const volume = (1/3) * Math.PI * r * r * h;
            totalAreaSpan.innerText = total.toFixed(2);
            lateralAreaSpan.innerText = lateral.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            const expectedL = Math.sqrt(r*r + h*h);
            if(Math.abs(L - expectedL) > 0.01)
                dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}, L=${L.toFixed(2)} ⚠️`;
            else
                dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}, L=${L.toFixed(2)}`;
            return { r, h, L };

            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;
            return { x: x1, y: y2, z: z2 };

                : 'برای رسم گسترده، ارتفاع مایل باید از شعاع قاعده بزرگ‌تر باشد.';
        }

        function draw3D() {
            geometryDisplay.drawSolid(ctx, canvas.width, canvas.height, 'cone', getValues(), rotatePoint3D);
        }

        function updateSlant() {
            let r = parseFloat(radiusInput.value);
            let h = parseFloat(heightInput.value);
            if(!isNaN(r) && r>0 && !isNaN(h) && h>0)
                slantInput.value = Math.sqrt(r*r + h*h).toFixed(2);
            refresh();
        }
        
        function updateFromSlant() {
            let r = parseFloat(radiusInput.value);
            let L = parseFloat(slantInput.value);
            if(!isNaN(r) && r>0 && !isNaN(L) && L>r)
                heightInput.value = Math.sqrt(L*L - r*r).toFixed(2);
            refresh();
        }
        
        function refresh() {
            calculateAndUpdate();
            if(currentView === 'net') drawNet();
            else draw3D();
        }
        
        function setupCanvas() {
            const container = canvas.parentElement;
            if(!container) return;
            const containerWidth = container.clientWidth - 10;
            canvas.width = Math.min(containerWidth, 700);
            canvas.height = canvas.width * 0.72;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            refresh();
        }
        
        function setView(v) {
            currentView = v;
            showNetBtn.setAttribute('aria-pressed', String(v === 'net'));
            show3DBtn.setAttribute('aria-pressed', String(v === '3d'));
            if(v === 'net') {
                showNetBtn.classList.add('btn-active');
                show3DBtn.classList.remove('btn-active');
                viewLabel.innerText = 'گسترده از یک دایره و یک قطاع دایره تشکیل شده است.';
                canvas.style.cursor = 'grab';
            } else {
                show3DBtn.classList.add('btn-active');
                showNetBtn.classList.remove('btn-active');
                viewLabel.innerText = 'برای چرخاندن شکل، تصویر را بکشید یا از کلیدهای جهت‌دار استفاده کنید.';
                canvas.style.cursor = 'grab';
            }
            refresh();
        }

        function onPointerDown(e) {
            if(currentView === 'net') {
                isDragging = true;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX = cx; lastDragY = cy;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            } else if(currentView === '3d') {
                isDragging3D = true;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX3D = cx; lastDragY3D = cy;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            }
        }
        
        function onPointerMove(e) {
            if(currentView === 'net' && isDragging) {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                netOffsetX += cx - lastDragX;
                netOffsetY += cy - lastDragY;
                lastDragX = cx; lastDragY = cy;
                drawNet();
                e.preventDefault();
            } else if(currentView === '3d' && isDragging3D) {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                rotationY += (cx - lastDragX3D) * 0.008;
                rotationX += (cy - lastDragY3D) * 0.008;
                rotationX = Math.max(-1.57, Math.min(1.57, rotationX));
                lastDragX3D = cx; lastDragY3D = cy;
                draw3D();
                e.preventDefault();
            }
        }
        
        function onPointerUp() {
            isDragging = false;
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }

        canvas.addEventListener('touchstart', onPointerDown, {passive:false});
        canvas.addEventListener('touchmove', onPointerMove, {passive:false});
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        radiusInput.addEventListener('input', updateSlant);
        heightInput.addEventListener('input', updateSlant);
        slantInput.addEventListener('input', updateFromSlant);
        updateBtn.addEventListener('click', refresh);
        resetBtn.addEventListener('click', ()=>{
            radiusInput.value = "5";
            heightInput.value = "12";
            slantInput.value = "13";
            netOffsetX = netOffsetY = 0;
            rotationY = -0.65; rotationX = -0.38;
            refresh();
        });
        showNetBtn.addEventListener('click', ()=>setView('net'));
        show3DBtn.addEventListener('click', ()=>setView('3d'));
        

        const resetView = document.getElementById('resetView');
        resetView.addEventListener('click', () => {
            netOffsetX = netOffsetY = 0;
            rotationX = -0.38;
            rotationY = -0.65;
            refresh();
        });
        canvas.addEventListener('keydown', event => {
            const steps = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
            const step = steps[event.key];
            if (!step) return;
            event.preventDefault();
            const [x, y] = step;
            if (currentView === '3d') {
                rotationY += x * 0.14;
                rotationX = Math.max(-1.5, Math.min(1.5, rotationX + y * 0.14));
            } else {
                netOffsetX = Math.max(-canvas.width * 0.3, Math.min(canvas.width * 0.3, netOffsetX + x * 12));
                netOffsetY = Math.max(-canvas.height * 0.3, Math.min(canvas.height * 0.3, netOffsetY + y * 12));
            }
            refresh();
        });

        window.addEventListener('resize', ()=>setTimeout(setupCanvas, 100));
        setupCanvas();
        setView('net');
    })();
</script>
</template>
<script type="text/plain" id="geometryRenderer">
const geometryDisplay = (() => {
    const base = '#f4bc69';
    const side = '#66c6e9';
    const otherSide = '#83d0b4';
    const ink = '#163247';
    const edge = '#e1f1f7';
    const turn = 2 * Math.PI;

    function path(ctx, points) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
        ctx.closePath();
    }

    function ring(count, radius, y) {
        return Array.from({ length: count }, (_, i) => {
            const angle = i * turn / count;
            return { x: radius * Math.cos(angle), y, z: radius * Math.sin(angle) };
        });
    }

    function model(shape, dimensions) {
        const { n, a, r, l, w, h } = dimensions;
        const curved = shape === 'cone' || shape === 'cylinder';
        const count = curved ? 72 : shape === 'cube' ? 4 : n;
        const radius = curved ? r : (shape === 'cube' ? 0 : a / (2 * Math.sin(Math.PI / n)));
        const lower = shape === 'cube'
            ? [[-l/2, -w/2], [l/2, -w/2], [l/2, w/2], [-l/2, w/2]].map(([x, z]) => ({ x, y: h/2, z }))
            : ring(count, radius, h/2);
        const upper = lower.map(point => ({ ...point, y: -h/2 }));
        const apex = { x: 0, y: -h/2, z: 0 };
        const pointed = shape === 'pyramid' || shape === 'cone';
        const faces = [{ points: lower, color: base, outline: true }];
        if (!pointed) faces.push({ points: upper, color: base, outline: true });
        for (let i = 0; i < count; i++) {
            const next = (i + 1) % count;
            faces.push({
                points: pointed ? [lower[i], lower[next], apex] : [lower[i], lower[next], upper[next], upper[i]],
                color: shape === 'cube' && i % 2 ? otherSide : side,
                outline: !curved,
            });
        }
        return faces;
    }

    function shade(color, factor) {
        const rgb = [1, 3, 5].map(i => Math.round(parseInt(color.slice(i, i + 2), 16) * factor));
        return 'rgb(' + rgb.join(',') + ')';
    }

    function drawSolid(ctx, width, height, shape, dimensions, rotate) {
        const magnitude = Math.max(...Object.values(dimensions).filter(value => typeof value === 'number'));
        const normalized = Object.fromEntries(Object.entries(dimensions).map(([key, value]) =>
            [key, typeof value === 'number' && key !== 'n' ? value / magnitude : value]));
        const faces = model(shape, normalized).map(face => {
            const points = face.points.map(({ x, y, z }) => rotate(x, y, z));
            const [p, q, r] = points;
            const u = { x: q.x - p.x, y: q.y - p.y, z: q.z - p.z };
            const v = { x: r.x - p.x, y: r.y - p.y, z: r.z - p.z };
            const normal = { x: u.y*v.z - u.z*v.y, y: u.z*v.x - u.x*v.z, z: u.x*v.y - u.y*v.x };
            const orientation = normal.x*p.x + normal.y*p.y + normal.z*p.z < 0 ? -1 : 1;
            const length = Math.hypot(normal.x, normal.y, normal.z);
            const lighting = (-0.42*normal.x - 0.52*normal.y + 0.74*normal.z) * orientation / length;
            const depth = points.reduce((sum, point) => sum + point.z, 0) / points.length;
            return { ...face, points, depth, visible: normal.z * orientation > 0, color: shade(face.color, 0.65 + 0.35 * Math.max(0, lighting)) };
        });

        ctx.clearRect(0, 0, width, height);
        const points = faces.flatMap(face => face.points);
        const xs = points.map(point => point.x);
        const ys = points.map(point => point.y);
        const left = Math.min(...xs), right = Math.max(...xs);
        const top = Math.min(...ys), bottom = Math.max(...ys);
        const scale = Math.min(width * 0.79 / (right - left), height * 0.76 / (bottom - top));
        if (!Number.isFinite(scale) || scale <= 0) return;
        const project = point => ({
            x: width / 2 + (point.x - left / 2 - right / 2) * scale,
            y: height / 2 + (point.y - top / 2 - bottom / 2) * scale,
        });

        ctx.save();
        ctx.lineJoin = 'round';
        for (const face of faces.sort((a, b) => a.depth - b.depth)) {
            if (!face.visible) continue;
            path(ctx, face.points.map(project));
            ctx.fillStyle = face.color;
            ctx.fill();
            ctx.strokeStyle = face.outline ? edge : face.color;
            ctx.lineWidth = face.outline ? 1.6 : 1;
            ctx.stroke();
        }
        ctx.restore();
    }

    const point = (x, y) => ({ x, y });
    const rect = (x, y, w, h) => [point(x,y), point(x+w,y), point(x+w,y+h), point(x,y+h)];
    const arc = (x, y, radius, start, sweep) => Array.from({ length: 97 }, (_, i) => {
        const angle = start + i * sweep / 96;
        return point(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
    });

    function net(shape, { n, a, h, l, w, r, L }) {
        const faces = [];
        const folds = [];
        const add = (points, color, label, center, capacity, area, faceHeight) =>
            faces.push({ points, color, label, center, capacity, area, faceHeight });
        const fold = (x1, y1, x2, y2) => folds.push([point(x1, y1), point(x2, y2)]);
        const circle = (x, y) => add(arc(x, y, r, 0, turn), base, 'قاعده', point(x, y), r * 1.4);

        if (shape === 'pyramid') {
            const radius = a / (2 * Math.sin(Math.PI / n));
            const apothem = a / (2 * Math.tan(Math.PI / n));
            const slope = Math.hypot(h, apothem);
            const corners = Array.from({ length: n }, (_, i) => {
                const angle = -Math.PI / 2 + (i + 0.5) * turn / n;
                return point(radius * Math.cos(angle), radius * Math.sin(angle));
            });
            add(corners, base, 'قاعده', point(0, 0), apothem * 1.7);
            for (let i = 0; i < n; i++) {
                const p = corners[i], q = corners[(i + 1) % n];
                const cx = (p.x + q.x) / 2, cy = (p.y + q.y) / 2;
                const tip = point(cx * (1 + slope/apothem), cy * (1 + slope/apothem));
                add([p, q, tip], side, 'وجه', point((p.x+q.x+tip.x)/3, (p.y+q.y+tip.y)/3), Math.min(a * 0.53, slope * 0.7));
                fold(p.x, p.y, q.x, q.y);
            }
        } else if (shape === 'prism' || shape === 'cube') {
            const isBox = shape === 'cube';
            const widths = isBox ? [w, l, w, l] : Array(n).fill(a);
            const names = ['چپ', 'جلو', 'راست', 'پشت'];
            let x = 0;
            widths.forEach((length, i) => {
                add(rect(x, 0, length, h), isBox && i % 2 === 0 ? otherSide : side,
                    isBox ? names[i] : String(i + 1), point(x + length/2, h/2), Math.min(length, h) * 0.78, isBox ? length * h : null, h);
                if (i > 0) fold(x, 0, x, h);
                x += length;
            });
            if (isBox) {
                add(rect(w, -w, l, w), base, 'بالا', point(w+l/2, -w/2), Math.min(l, w) * 0.78, l * w, w);
                add(rect(w, h, l, w), base, 'پایین', point(w+l/2, h+w/2), Math.min(l, w) * 0.78, l * w, w);
                fold(w, 0, w+l, 0);
                fold(w, h, w+l, h);
            } else {
                const radius = a / (2 * Math.sin(Math.PI / n));
                const apothem = a / (2 * Math.tan(Math.PI / n));
                for (const [y, angle] of [[-apothem, Math.PI/2], [h+apothem, -Math.PI/2]]) {
                    const polygon = Array.from({ length: n }, (_, i) => {
                        const t = angle + (i + 0.5) * turn / n;
                        return point(a/2 + radius * Math.cos(t), y + radius * Math.sin(t));
                    });
                    add(polygon, base, 'قاعده', point(a/2, y), apothem * 1.7);
                }
                fold(0, 0, a, 0);
                fold(0, h, a, h);
            }
        } else if (shape === 'cylinder') {
            const circumference = turn * r;
            add(rect(0, 0, circumference, h), side, 'سطح جانبی', point(circumference/2, h/2), Math.min(circumference*0.8, h*2));
            circle(circumference/2, -r);
            circle(circumference/2, h+r);
        } else {
            if (L <= r) return { faces, folds };
            const sweep = turn * (r / L);
            const points = [point(0, 0), ...arc(0, 0, L, -sweep / 2, sweep)];
            add(points, side, 'قطاع', point(L * 0.58, 0), Math.min(L * 0.75, r * 1.5));
            circle(L + r * 1.25, 0);
        }
        return { faces, folds };
    }

    function drawNet(ctx, width, height, shape, dimensions, offset) {
        ctx.clearRect(0, 0, width, height);
        const { faces, folds } = net(shape, dimensions);
        if (!faces.length) return;
        const points = faces.flatMap(face => face.points);
        const xs = points.map(p => p.x), ys = points.map(p => p.y);
        const left = Math.min(...xs), right = Math.max(...xs);
        const top = Math.min(...ys), bottom = Math.max(...ys);
        const scale = Math.min(width * 0.86 / (right - left), height * 0.81 / (bottom - top));
        if (!Number.isFinite(scale) || scale <= 0) return;
        const project = p => point(width/2 + (p.x - left/2 - right/2)*scale + offset.x,
            height/2 + (p.y - top/2 - bottom/2)*scale + offset.y);
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const face of faces) {
            path(ctx, face.points.map(project));
            ctx.fillStyle = face.color;
            ctx.fill();
            ctx.strokeStyle = edge;
            ctx.lineWidth = 1.6;
            ctx.stroke();
            const labelWidth = face.capacity * scale;
            const font = Math.min(22, Math.max(14, width * 0.03));
            ctx.font = '700 ' + font + 'px Tahoma, Arial, sans-serif';
            if (ctx.measureText(face.label).width <= labelWidth) {
                const center = project(face.center);
                ctx.fillStyle = ink;
                const area = face.area == null ? '' : face.area.toFixed(1);
                const showArea = area && face.faceHeight * scale >= font * 2.5
                    && ctx.measureText(area).width <= labelWidth;
                ctx.fillText(face.label, center.x, center.y - (showArea ? font * 0.5 : 0));
                if (showArea) ctx.fillText(area, center.x, center.y + font * 0.65);
            }
        }
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        for (const [start, end] of folds) {
            const a = project(start), b = project(end);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
        }
        ctx.restore();
    }

    return { drawSolid, drawNet };
})();

</script>
<script>
const home = document.getElementById('home');
const viewer = document.getElementById('viewer');
const back = document.getElementById('backBtn');
const labStyles = document.getElementById('labStyles').textContent;
const geometryRenderer = document.getElementById('geometryRenderer').textContent;
let activeCard;

for (const card of document.querySelectorAll('.shape-card')) {
  const name = card.dataset.name;
  card.addEventListener('click', () => {
    activeCard = card;
    const content = document.getElementById(card.dataset.shape).innerHTML;
    viewer.title = 'آزمایشگاه ' + name;
    viewer.srcdoc = '<!doctype html><html lang="fa" dir="rtl"><head>' +
      '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + name + '</title><style>' + labStyles + '</style></head><body>' +
      '<' + 'script>' + geometryRenderer + '</' + 'script>' + content + '</body></html>';
    home.hidden = true;
    document.body.classList.add('lab-active');
    viewer.hidden = back.hidden = false;
    back.focus();
  });
}
back.addEventListener('click', () => {
  viewer.hidden = back.hidden = true;
  viewer.removeAttribute('srcdoc');
  document.body.classList.remove('lab-active');
  home.hidden = false;
  activeCard.focus();
});

const palette = ['#d5eee5', '#83c6b3', '#348b77', '#1e6456'];
function face(ctx, points, fill) {
  ctx.beginPath();
  points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.stroke();
}
for (const preview of document.querySelectorAll('.shape-preview')) {
  const ctx = preview.getContext('2d');
  ctx.scale(2, 2);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 1.7;
  ctx.strokeStyle = palette[3];
  const [light, mid, dark] = palette;
  switch (preview.parentElement.dataset.shape) {
    case 'pyramid':
      face(ctx, [[73, 15], [105, 67], [78, 84], [45, 71]], light);
      face(ctx, [[73, 15], [78, 84], [45, 71]], mid);
      face(ctx, [[73, 15], [105, 67], [78, 84]], dark);
      break;
    case 'prism':
      face(ctx, [[49, 36], [76, 49], [76, 84], [49, 71]], mid);
      face(ctx, [[76, 49], [104, 35], [104, 70], [76, 84]], dark);
      face(ctx, [[49, 36], [62, 21], [91, 20], [104, 35], [76, 49]], light);
      break;
    case 'cube':
      face(ctx, [[40, 38], [81, 50], [81, 81], [40, 69]], mid);
      face(ctx, [[81, 50], [111, 36], [111, 67], [81, 81]], dark);
      face(ctx, [[40, 38], [72, 24], [111, 36], [81, 50]], light);
      break;
    case 'cylinder':
      ctx.beginPath();
      ctx.moveTo(49, 31);
      ctx.lineTo(49, 69);
      ctx.bezierCurveTo(49, 86, 103, 86, 103, 69);
      ctx.lineTo(103, 31);
      ctx.fillStyle = mid;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(76, 31, 27, 11, 0, 0, 2 * Math.PI);
      ctx.fillStyle = light;
      ctx.fill();
      ctx.stroke();
      break;
    case 'cone':
      ctx.beginPath();
      ctx.moveTo(76, 17);
      ctx.lineTo(48, 67);
      ctx.bezierCurveTo(45, 87, 107, 87, 104, 67);
      ctx.closePath();
      const gradient = ctx.createLinearGradient(48, 0, 104, 0);
      gradient.addColorStop(0, light);
      gradient.addColorStop(1, dark);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.stroke();
      break;
  }
}

</script>
