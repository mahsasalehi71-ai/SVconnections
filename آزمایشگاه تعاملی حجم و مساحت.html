<script>
    (function () {
        // --- عناصر DOM ---
        const radiusInput = document.getElementById('radius');
        const heightInput = document.getElementById('height');
        const updateBtn = document.getElementById('updateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalAreaSpan = document.getElementById('totalArea');
        const lateralAreaSpan = document.getElementById('lateralArea');
        const volumeSpan = document.getElementById('volume');
        const dimensionsSpan = document.getElementById('dimensions');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const showNetBtn = document.getElementById('showNetBtn');
        const show3DBtn = document.getElementById('show3DBtn');
        const viewLabel = document.getElementById('viewLabel');

        // --- وضعیت نما ---
        let currentView = 'net';      // 'net' or '3d'
        let netOffsetX = 0, netOffsetY = 0;
        let isDragging = false;
        let lastDragX = 0, lastDragY = 0;

        // --- وضعیت چرخش سه بعدی (مشابه هرم) ---
        let rotationY = -0.65;    // چرخش حول محور Y
        let rotationX = 0.35;     // چرخش حول محور X
        let isDragging3D = false;
        let lastDragX3D = 0, lastDragY3D = 0;

        // --- توابع کمکی ---
        function getValues() {
            let r = parseFloat(radiusInput.value);
            let h = parseFloat(heightInput.value);
            if (isNaN(r) || r <= 0) r = 5;
            if (isNaN(h) || h <= 0) h = 8;
            return {r, h};
        }

        function calculateAndUpdate() {
            let {r, h} = getValues();
            const areaBase = Math.PI * r * r;
            const lateralArea = 2 * Math.PI * r * h;
            const totalArea = 2 * areaBase + lateralArea;
            const volume = areaBase * h;
            totalAreaSpan.innerText = totalArea.toFixed(2);
            lateralAreaSpan.innerText = lateralArea.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}`;
            return {r, h, areaBase};
        }

        // ========== 1. نمای گسترده (Net) ==========
        function drawNet() {
            let {r, h} = getValues();
            const width = canvas.width, height = canvas.height;
            ctx.clearRect(0, 0, width, height);

            const circumference = 2 * Math.PI * r;
            const rectW = circumference;
            const rectH = h;
            const circleDiameter = 2 * r;

            const netPureWidth = rectW;
            const netPureHeight = rectH + circleDiameter * 2;

            const marginPercent = 0.02;
            const availableWidth = width * (1 - marginPercent * 2);
            const availableHeight = height * (1 - marginPercent * 2);

            let scale = Math.min(availableWidth / netPureWidth, availableHeight / netPureHeight);
            scale = Math.min(scale, 12);
            scale = Math.max(scale, 0.3);

            const L = rectW * scale;
            const W = rectH * scale;
            const circleDiaScaled = circleDiameter * scale;
            const circleRadiusScaled = r * scale;

            const totalDrawWidth = L;
            const totalDrawHeight = netPureHeight * scale;
            const startX = (width - totalDrawWidth) / 2 + netOffsetX;
            const startY = (height - totalDrawHeight) / 2 + netOffsetY;

            const lateralColor = "rgba(74, 144, 226, 0.88)";
            const baseColor = "rgba(255, 160, 80, 0.92)";
            const strokeLight = "#ffdd99";

            // مستطیل بدنه
            const rectY = startY + circleDiaScaled;
            ctx.beginPath();
            ctx.rect(startX, rectY, L, W);
            ctx.fillStyle = lateralColor;
            ctx.fill();
            ctx.strokeStyle = strokeLight;
            ctx.lineWidth = 1.8;
            ctx.stroke();

            // دایره بالا
            const topCircleCenterX = startX + L / 2;
            const topCircleCenterY = startY + circleDiaScaled / 2;
            ctx.beginPath();
            ctx.arc(topCircleCenterX, topCircleCenterY, circleRadiusScaled, 0, 2 * Math.PI);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.stroke();

            // دایره پایین
            const bottomCircleCenterY = startY + circleDiaScaled + W + circleDiaScaled / 2;
            ctx.beginPath();
            ctx.arc(topCircleCenterX, bottomCircleCenterY, circleRadiusScaled, 0, 2 * Math.PI);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.stroke();
        }

        // ========== 2. نمای سه بعدی با تکنیک چرخش مشابه هرم ==========
        // چرخش نقطه در فضای سه بعدی (دور محورهای Y و X)
        function rotatePoint3D(x, y, z) {
            const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);

            // چرخش حول محور Y
            let x1 = x * cosY + z * sinY;
            let z1 = -x * sinY + z * cosY;

            // چرخش حول محور X
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            return {x: x1, y: y2, z: z2};
        }

        // تبدیل پرسپکتیو ساده
        function projectPerspective(x, y, z, cx, cy, perspective = 800) {
            const scale = perspective / (perspective + (z + 5));
            return {
                x: cx + x * scale,
                y: cy + y * scale,
                scale: scale
            };
        }

        function draw3D() {
            let {r, h} = getValues();
            const width = canvas.width, height = canvas.height;

            if (width <= 0 || height <= 0 || r <= 0 || h <= 0) return;

            // پس‌زمینه گرادیان
            const bg = ctx.createLinearGradient(0, 0, width, height);
            bg.addColorStop(0, '#12192f');
            bg.addColorStop(1, '#070b16');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);

            // سایه نرم زیر استوانه
            const cx = width / 2;
            const cy = height / 2 + 30;
            const shadowGrad = ctx.createRadialGradient(cx, height - 55, 0, cx, height - 55, 130);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
            shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.20)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(cx, height - 55, 140, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // ------------------- مرحله 1: ایجاد نقاط سه بعدی -------------------
            const segments = Math.max(32, Math.floor(32 * Math.sqrt(r / 5))); // کیفیت بالا
            const bottomPoints3D = [];
            const topPoints3D = [];

            for (let i = 0; i <= segments; i++) {
                const angle = i * 2 * Math.PI / segments;
                const x = r * Math.cos(angle);
                const z = r * Math.sin(angle);
                // مختصات محلی: قاعده پایین در y = -h/2 ، قاعده بالا در y = +h/2 تا مرکز استوانه در (0,0,0) باشد
                bottomPoints3D.push({x: x, y: -h / 2, z: z});
                topPoints3D.push({x: x, y: h / 2, z: z});
            }

            // اعمال چرخش به تمام نقاط
            const rotatedBottom = bottomPoints3D.map(p => rotatePoint3D(p.x, p.y, p.z));
            const rotatedTop = topPoints3D.map(p => rotatePoint3D(p.x, p.y, p.z));

            // ------------------- مرحله 2: مقیاس اولیه و bounding box برای fit -------------------
            const perspectiveDist = 650;
            // پروجکشن موقت برای محاسبه ابعاد
            const tempProjBottom = rotatedBottom.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, perspectiveDist));
            const tempProjTop = rotatedTop.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, perspectiveDist));
            const allTempPoints = [...tempProjBottom, ...tempProjTop];

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const p of allTempPoints) {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            }
            const projWidth = maxX - minX;
            const projHeight = maxY - minY;

            // محاسبه fitScale طوری که کل استوانه درون صفحه با حاشیه 88% قرار گیرد
            const targetMargin = 0.88;
            let fitScale = 1;
            if (projWidth > 0 && projHeight > 0) {
                fitScale = Math.min(
                    (width * targetMargin) / projWidth,
                    (height * targetMargin) / projHeight
                );
            }
            fitScale = Math.min(fitScale, 5.5);
            fitScale = Math.max(fitScale, 0.3);

            // اعمال fitScale به نقاط چرخش یافته
            const finalBottom = rotatedBottom.map(p => ({x: p.x * fitScale, y: p.y * fitScale, z: p.z}));
            const finalTop = rotatedTop.map(p => ({x: p.x * fitScale, y: p.y * fitScale, z: p.z}));

            // ------------------- مرحله 3: مرکزگذاری دقیق -------------------
            const tempFinalBottom = finalBottom.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, perspectiveDist));
            const tempFinalTop = finalTop.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, perspectiveDist));
            const allFinal = [...tempFinalBottom, ...tempFinalTop];
            let finalMinX = Infinity, finalMaxX = -Infinity, finalMinY = Infinity, finalMaxY = -Infinity;
            for (const p of allFinal) {
                finalMinX = Math.min(finalMinX, p.x);
                finalMaxX = Math.max(finalMaxX, p.x);
                finalMinY = Math.min(finalMinY, p.y);
                finalMaxY = Math.max(finalMaxY, p.y);
            }

            const centerOffsetX = (width - (finalMinX + finalMaxX)) / 2;
            const centerOffsetY = (height - (finalMinY + finalMaxY)) / 2;

            // پروجکشن نهایی با مرکزدهی صحیح
            const projBottom = finalBottom.map(p => projectPerspective(p.x, p.y, p.z, centerOffsetX, centerOffsetY, perspectiveDist));
            const projTop = finalTop.map(p => projectPerspective(p.x, p.y, p.z, centerOffsetX, centerOffsetY, perspectiveDist));

            // ------------------- رسم بدنه (نوارهای ذوزنقه‌ای) -------------------
            for (let i = 0; i < segments; i++) {
                const p1b = projBottom[i];
                const p2b = projBottom[i + 1];
                const p1t = projTop[i];
                const p2t = projTop[i + 1];

                ctx.beginPath();
                ctx.moveTo(p1b.x, p1b.y);
                ctx.lineTo(p2b.x, p2b.y);
                ctx.lineTo(p2t.x, p2t.y);
                ctx.lineTo(p1t.x, p1t.y);
                ctx.closePath();

                // گرادیانت ساده برای حجم نمایی
                const grad = ctx.createLinearGradient(p1b.x, p1b.y, p1t.x, p1t.y);
                grad.addColorStop(0, "rgba(80, 170, 210, 0.85)");
                grad.addColorStop(1, "rgba(40, 110, 160, 0.85)");
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 220, 150, 0.4)";
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            // رسم قاعده پایین (با رنگ و سایه)
            ctx.beginPath();
            ctx.moveTo(projBottom[0].x, projBottom[0].y);
            for (let i = 1; i <= segments; i++) {
                ctx.lineTo(projBottom[i].x, projBottom[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = "rgba(210, 150, 70, 0.95)";
            ctx.fill();
            ctx.strokeStyle = "#ffcc88";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // رسم قاعده بالا
            ctx.beginPath();
            ctx.moveTo(projTop[0].x, projTop[0].y);
            for (let i = 1; i <= segments; i++) {
                ctx.lineTo(projTop[i].x, projTop[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = "rgba(230, 170, 80, 0.95)";
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#ffdd99aa';
            const edgeStep = Math.max(1, Math.floor(segments / 10));
            for (let i = 0; i <= segments; i += edgeStep) {
                ctx.beginPath();
                ctx.moveTo(projBottom[i].x, projBottom[i].y);
                ctx.lineTo(projTop[i].x, projTop[i].y);
                ctx.stroke();
            }

            // افکت درخشش ملایم در مرکز
            const centerProj = projectPerspective(0, 0, 0, centerOffsetX, centerOffsetY, perspectiveDist);
            const glow = ctx.createRadialGradient(centerProj.x, centerProj.y, 0, centerProj.x, centerProj.y, 70);

            glow.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(centerProj.x, centerProj.y, 70, 0, Math.PI * 2);
            ctx.fill();

        function refresh() {
            calculateAndUpdate();
            if (currentView === 'net') {
                drawNet();
            } else {
                draw3D();

        function setupCanvas() {
            const container = canvas.parentElement;
            if (!container) return;
            const containerWidth = container.clientWidth - 12;

            canvas.style.height = `${canvas.height}px`;
            refresh();

            currentView = view;

                showNetBtn.classList.add('btn-active');

            refresh();
        }

        function handleNetDragStart(e) {
            if (currentView !== 'net') return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX = clientX;
            lastDragY = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }

        function handleNetDragMove(e) {
            if (!isDragging || currentView !== 'net') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            netOffsetX += clientX - lastDragX;
            netOffsetY += clientY - lastDragY;
            lastDragX = clientX;
            lastDragY = clientY;
            drawNet();
            e.preventDefault();
        }

        function handleNetDragEnd() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        // --- رویدادهای چرخش برای نمای سه بعدی (مشابه هرم) ---
        function handle3DDragStart(e) {
            if (currentView !== '3d') return;
            isDragging3D = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX3D = clientX;
            lastDragY3D = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }

        function handle3DDragMove(e) {
            if (!isDragging3D || currentView !== '3d') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - lastDragX3D;
            const dy = clientY - lastDragY3D;

            rotationY += dx * 0.008;
            rotationX += dy * 0.008;

            // محدودیت برای جلوگیری از چرخش بیش از حد
            rotationX = Math.max(-1.4, Math.min(1.4, rotationX));

            lastDragY3D = clientY;

        }

        function handle3DDragEnd() {
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }

        // توزیع رویدادها بر اساس نما
        function onPointerDown(e) {
            if (currentView === 'net') handleNetDragStart(e);
            else if (currentView === '3d') handle3DDragStart(e);
        }

        function onPointerMove(e) {
            if (currentView === 'net') handleNetDragMove(e);
            else if (currentView === '3d') handle3DDragMove(e);
        }

        function onPointerUp(e) {
            if (currentView === 'net') handleNetDragEnd(e);
            else if (currentView === '3d') handle3DDragEnd(e);
        }

        // ثبت رویدادها
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        // رویدادهای ورودی
        radiusInput.addEventListener('input', refresh);
        heightInput.addEventListener('input', refresh);
        updateBtn.addEventListener('click', refresh);
        resetBtn.addEventListener('click', () => {

        });
        showNetBtn.addEventListener('click', () => setView('net'));
        show3DBtn.addEventListener('click', () => setView('3d'));

        window.addEventListener('resize', () => setTimeout(setupCanvas, 100));
        setupCanvas();
        setView('net');
    })();
</script>

    (function(){

        const show3DBtn = document.getElementById('show3DBtn');

            if (isNaN(r) || r <= 0) r = 5;
            if (isNaN(h) || h <= 0) h = 12;

        }

        function calculateAndUpdate() {
            let { r, h, L } = getValues();
            const areaBase = Math.PI * r * r;
            const lateral = Math.PI * r * L;
            const total = areaBase + lateral;
            const volume = (1/3) * Math.PI * r * r * h;
            totalAreaSpan.innerText = total.toFixed(2);
            lateralAreaSpan.innerText = lateral.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            const expectedL = Math.sqrt(r*r + h*h);
            if(Math.abs(L - expectedL) > 0.01)
                dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}, L=${L.toFixed(2)} ⚠️`;
            else
                dimensionsSpan.innerText = `r=${r.toFixed(2)}, h=${h.toFixed(2)}, L=${L.toFixed(2)}`;

            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;
            return { x: x1, y: y2, z: z2 };
        }

        function projectPerspective(x, y, z, cx, cy, perspective = 1100) {
            const scale = perspective / (perspective + z);
            return { x: cx + x * scale, y: cy + y * scale };

        function drawNet() {
            let { r, h, L } = getValues();
            const width = canvas.width, height = canvas.height;
            if(width <= 0 || height <= 0) return;
            ctx.clearRect(0, 0, width, height);
            
            ctx.beginPath();
            ctx.ellipse(width/2, height*0.72, width*0.15, height*0.045, 0, 0, Math.PI*2);
            const shadow = ctx.createRadialGradient(width/2, height*0.72, 5, width/2, height*0.72, width*0.15);
            shadow.addColorStop(0, "rgba(0,0,0,.35)");
            shadow.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = shadow;
            ctx.fill();
            
            const circleRadius = r;
            const sectorRadius = L;
            const sectorAngle = (2 * Math.PI * r) / L;
            
            const circleDiameter = circleRadius * 2;
            const sectorWidth = sectorRadius * 2;
            const sectorHeight = sectorRadius * Math.sin(sectorAngle / 2) * 2;
            const maxShapeWidth = Math.max(circleDiameter, sectorWidth);
            const maxShapeHeight = Math.max(circleDiameter, sectorHeight);
            const gap = maxShapeWidth * 0.25;
            const totalWidth = maxShapeWidth * 2 + gap;
            const totalHeight = maxShapeHeight;
            
            const marginPercent = 0.08;
            const availableWidth = width * (1 - marginPercent * 2);
            const availableHeight = height * (1 - marginPercent * 2);
            
            let scale = Math.min(availableWidth / totalWidth, availableHeight / totalHeight);
            scale = Math.min(scale, 7);
            scale = Math.max(scale, 0.3);

            ctx.beginPath();
            ctx.arc(circleCenterX, circleCenterY, scaledCircleRadius, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255,160,80,0.92)";

            ctx.fillText("قاعده", circleCenterX - scaledCircleRadius/2, circleCenterY + scaledCircleRadius + 8);

            ctx.font = "9px monospace";
            ctx.fillStyle = "#ffddaa88";
            ctx.fillText(`r = ${r.toFixed(2)}`, circleCenterX - scaledCircleRadius/2, circleCenterY + scaledCircleRadius + 20);
            ctx.fillText(`L = ${L.toFixed(2)}`, sectorCenterX - scaledSectorRadius/2, sectorCenterY - scaledSectorRadius - 18);

        function draw3D() {
            let { r, h, L } = getValues();

            const cx = width / 2;
            const shadowGrad = ctx.createRadialGradient(cx, height - 55, 0, cx, height - 55, 130);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
            shadowGrad.addColorStop(0.45, 'rgba(0,0,0,0.20)');

            const segments = Math.max(48, Math.floor(48 * Math.sqrt(r / 5)));
            
            const baseVertices3D = [];
            for (let i = 0; i <= segments; i++) {
                const angle = i * 2 * Math.PI / segments;
                baseVertices3D.push({ x: r * Math.cos(angle), y: -h/2, z: r * Math.sin(angle) });
            }
            const apex3D = { x: 0, y: h/2, z: 0 };
            
            const rotatedBase = baseVertices3D.map(p => rotatePoint3D(p.x, p.y, p.z));
            const rotatedApex = rotatePoint3D(apex3D.x, apex3D.y, apex3D.z);
            
            const tempProjectedBase = rotatedBase.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 700));
            const tempProjectedApex = projectPerspective(rotatedApex.x, rotatedApex.y, rotatedApex.z, 0, 0, 700);
            
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            [...tempProjectedBase, tempProjectedApex].forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            });
            
            const targetMargin = 0.78;
            let fitScale = 1;
            if (maxX - minX > 0 && maxY - minY > 0) {
                fitScale = Math.min((width * targetMargin) / (maxX - minX), (height * targetMargin) / (maxY - minY));
            }
            
            const finalRotatedBase = rotatedBase.map(p => ({ x: p.x * fitScale, y: p.y * fitScale, z: p.z }));
            const finalRotatedApex = { x: rotatedApex.x * fitScale, y: rotatedApex.y * fitScale, z: rotatedApex.z };
            
            const finalTempBase = finalRotatedBase.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 700));
            const finalTempApex = projectPerspective(finalRotatedApex.x, finalRotatedApex.y, finalRotatedApex.z, 0, 0, 700);
            
            let finalMinX = Infinity, finalMaxX = -Infinity, finalMinY = Infinity, finalMaxY = -Infinity;
            [...finalTempBase, finalTempApex].forEach(p => {
                finalMinX = Math.min(finalMinX, p.x);
                finalMaxX = Math.max(finalMaxX, p.x);
                finalMinY = Math.min(finalMinY, p.y);
                finalMaxY = Math.max(finalMaxY, p.y);
            });
            
            const centerOffsetX = (width - (finalMinX + finalMaxX)) / 2;
            const centerOffsetY = (height - (finalMinY + finalMaxY)) / 2;
            
            const projectedBase = finalRotatedBase.map(p => projectPerspective(p.x, p.y, p.z, centerOffsetX, centerOffsetY, 700));
            const projectedApex = projectPerspective(finalRotatedApex.x, finalRotatedApex.y, finalRotatedApex.z, centerOffsetX, centerOffsetY, 700);
            
            for (let i = 0; i < segments; i++) {
                ctx.beginPath();
                ctx.moveTo(projectedBase[i].x, projectedBase[i].y);
                ctx.lineTo(projectedBase[i + 1].x, projectedBase[i + 1].y);
                ctx.lineTo(projectedApex.x, projectedApex.y);
                ctx.closePath();
                const grad = ctx.createLinearGradient(projectedBase[i].x, projectedBase[i].y, projectedApex.x, projectedApex.y);
                grad.addColorStop(0, `rgba(80, 160, 210, 0.88)`);
                grad.addColorStop(0.5, `rgba(180, 110, 70, 0.88)`);
                grad.addColorStop(1, `rgba(220, 80, 50, 0.85)`);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 220, 150, 0.4)";
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }
            
            ctx.beginPath();
            ctx.moveTo(projectedBase[0].x, projectedBase[0].y);
            for (let i = 1; i <= segments; i++) ctx.lineTo(projectedBase[i].x, projectedBase[i].y);
            ctx.closePath();
            ctx.fillStyle = "rgba(210, 150, 70, 0.94)";
            ctx.fill();
            ctx.strokeStyle = "#ffcc88";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#ffdd99';
            const edgeStep = Math.max(1, Math.floor(segments / 12));
            for (let i = 0; i <= segments; i += edgeStep) {
                ctx.beginPath();
                ctx.moveTo(projectedBase[i].x, projectedBase[i].y);
                ctx.lineTo(projectedApex.x, projectedApex.y);
                ctx.stroke();
            }
            
            const glow = ctx.createRadialGradient(projectedApex.x, projectedApex.y, 0, projectedApex.x, projectedApex.y, 35);
            glow.addColorStop(0, 'rgba(255,255,255,0.55)');
            glow.addColorStop(0.4, 'rgba(255,255,255,0.18)');
            glow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(projectedApex.x, projectedApex.y, 35, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateSlant() {
            let r = parseFloat(radiusInput.value);
            let h = parseFloat(heightInput.value);
            if(!isNaN(r) && r>0 && !isNaN(h) && h>0)
                slantInput.value = Math.sqrt(r*r + h*h).toFixed(2);
            refresh();
        }
        
        function updateFromSlant() {
            let r = parseFloat(radiusInput.value);
            let L = parseFloat(slantInput.value);
            if(!isNaN(r) && r>0 && !isNaN(L) && L>r)
                heightInput.value = Math.sqrt(L*L - r*r).toFixed(2);
            refresh();
        }
        
        function refresh() {
            calculateAndUpdate();
            if(currentView === 'net') drawNet();
            else draw3D();
        }
        
        function setupCanvas() {
            const container = canvas.parentElement;
            if(!container) return;
            const containerWidth = container.clientWidth - 12;
            canvas.width = Math.min(containerWidth, 700);
            canvas.height = canvas.width * 0.72;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            refresh();
        }
        
        function setView(v) {
            currentView = v;
            if(v === 'net') {
                showNetBtn.classList.add('btn-active');
                show3DBtn.classList.remove('btn-active');
                viewLabel.innerText = 'گسترده مخروط | بدون تداخل';
                canvas.style.cursor = 'grab';
            } else {
                show3DBtn.classList.add('btn-active');
                showNetBtn.classList.remove('btn-active');
                viewLabel.innerText = 'نمای سه بعدی | چرخش با ماوس';
                canvas.style.cursor = 'grab';
            }
            refresh();
        }

        function onPointerDown(e) {
            if(currentView === 'net') {
                isDragging = true;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX = cx; lastDragY = cy;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            } else if(currentView === '3d') {
                isDragging3D = true;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX3D = cx; lastDragY3D = cy;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            }
        }
        
        function onPointerMove(e) {
            if(currentView === 'net' && isDragging) {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                netOffsetX += cx - lastDragX;
                netOffsetY += cy - lastDragY;
                lastDragX = cx; lastDragY = cy;
                drawNet();
                e.preventDefault();
            } else if(currentView === '3d' && isDragging3D) {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                rotationY += (cx - lastDragX3D) * 0.008;
                rotationX += (cy - lastDragY3D) * 0.008;
                rotationX = Math.max(-1.57, Math.min(1.57, rotationX));
                lastDragX3D = cx; lastDragY3D = cy;
                draw3D();
                e.preventDefault();
            }
        }
        
        function onPointerUp() {
            isDragging = false;
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }

        canvas.addEventListener('touchstart', onPointerDown, {passive:false});
        canvas.addEventListener('touchmove', onPointerMove, {passive:false});
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        radiusInput.addEventListener('input', updateSlant);
        heightInput.addEventListener('input', updateSlant);
        slantInput.addEventListener('input', updateFromSlant);
        updateBtn.addEventListener('click', refresh);
        resetBtn.addEventListener('click', ()=>{
            radiusInput.value = "5";
            heightInput.value = "12";
            slantInput.value = "13";
            netOffsetX = netOffsetY = 0;
            rotationY = -0.65; rotationX = 0.35;
            refresh();
        });
        showNetBtn.addEventListener('click', ()=>setView('net'));
        show3DBtn.addEventListener('click', ()=>setView('3d'));
        
        window.addEventListener('resize', ()=>setTimeout(setupCanvas, 100));
        setupCanvas();
        setView('net');
    })();
</script>
</body>
</html>
</template>

<script>

function startLab(){

const shape=document.getElementById("shape").value;

if(!shape){
alert("لطفاً یک شکل را انتخاب کنید");
return;
}

const template=document.getElementById(shape);

if(!template){
alert("کد این شکل پیدا نشد");
return;
}

const html=template.innerHTML;

const blob=new Blob([html],{type:"text/html"});
const url=URL.createObjectURL(blob);

const viewer=document.getElementById("viewer");

viewer.src=url;
viewer.style.display="block";

document.getElementById("home").style.display="none";
document.getElementById("backBtn").style.display="inline-block";

}

function goBack(){

const viewer=document.getElementById("viewer");

viewer.style.display="none";
viewer.src="";

document.getElementById("home").style.display="block";
document.getElementById("backBtn").style.display="none";

}

</script>
