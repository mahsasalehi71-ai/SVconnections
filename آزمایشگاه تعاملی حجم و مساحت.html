<body>
    <div class="container">
        <h1>🔺هرم منتظم & چهاروجهی</h1>
        <div class="main-card">
            <div class="two-columns">
                <div class="input-panel">
                    <div class="input-group">
                        <label>🔷 نوع هرم</label>
                        <select id="sidesCount">
                            <option value="3">3 - هرم سه‌ضلعی (قاعده مثلث)</option>
                            <option value="tetra" selected>⚡ ۴ وجه منتظم (چهاروجهی - همه مثلث متساوی‌الاضلاع)</option>
                            <option value="4">4 - هرم چهارضلعی (قاعده مربع)</option>
                            <option value="5">5 - هرم پنج‌ضلعی</option>
                            <option value="6">6 - هرم شش‌ضلعی</option>
                            <option value="7">7 - هرم هفت‌ضلعی</option>
                            <option value="8">8 - هرم هشت‌ضلعی</option>
                        </select>
                    </div>
                    <div class="input-group"><label>📏 طول ضلع قاعده (a)</label><input type="number" id="sideLength" value="6" step="any"></div>
                    <div class="input-group"><label>📏 ارتفاع هرم (h)</label><input type="number" id="height" value="8" step="any"></div>
                    <div class="btn-group"><button id="updateBtn" class="btn-primary">✨ بروزرسانی</button><button id="resetBtn" class="btn-secondary">🔄 بازنشانی</button></div>
                    <div class="results-panel">
                        <div class="result-item"><span class="result-label">🧮 مساحت کل</span><span class="result-value"><span id="totalArea">0</span><span class="unit">cm²</span><span class="formula-text">(مساحت قاعده + مساحت جانبی)</span></span></div>
                        <div class="result-item"><span class="result-label">📐 مساحت جانبی</span><span class="result-value"><span id="lateralArea">0</span><span class="unit">cm²</span><span class="formula-text">(n × ½ × a × ارتفاع مثلث جانبی)</span></span></div>
                        <div class="result-item"><span class="result-label">💧 حجم</span><span class="result-value"><span id="volume">0</span><span class="unit">cm³</span><span class="formula-text">(⅓ × مساحت قاعده × h)</span></span></div>
                        <div class="result-item"><span class="result-label">🔍 مشخصات</span><span class="result-value" style="font-size: 13px;"><span id="dimensions"></span></span></div>
                    </div>
                    <div class="info-text">⚡ چهاروجهی منتظم: ارتفاع خودکار محاسبه می‌شود     </div>
                </div>
                <div class="drawing-panel">
                    <div class="view-toggle"><button id="showNetBtn" class="view-btn btn-active">🧩 گسترده (Net)</button><button id="show3DBtn" class="view-btn">📦 نمای ۳ بعدی</button></div>
                    <div class="canvas-container"><canvas id="mainCanvas" width="600" height="480"></canvas></div>
                    <div class="info-text"><span class="badge" id="viewLabel">هرم منتظم | وجه‌های جانبی مثلث متساوی‌الساقین</span><span class="badge" style="margin-right:5px;">✨ چهاروجهی: همه مثلث متساوی‌الاضلاع</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            // عناصر DOM
            const sidesSelect = document.getElementById('sidesCount');
            const sideInput = document.getElementById('sideLength');
            const heightInput = document.getElementById('height');
            const updateBtn = document.getElementById('updateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const totalAreaSpan = document.getElementById('totalArea');
            const lateralAreaSpan = document.getElementById('lateralArea');
            const volumeSpan = document.getElementById('volume');
            const dimensionsSpan = document.getElementById('dimensions');
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const showNetBtn = document.getElementById('showNetBtn');
            const show3DBtn = document.getElementById('show3DBtn');
            const viewLabel = document.getElementById('viewLabel');
            
            let currentView = 'net';
            let netOffsetX = 0, netOffsetY = 0;
            let isDragging = false;
            let lastDragX = 0, lastDragY = 0;
            
            // متغیرهای چرخش سه بعدی با ماوس
            let rotationY = -0.65;   // چرخش حول محور Y
            let rotationX = 0.35;    // چرخش حول محور X
            let isDragging3D = false;
            let lastDragX3D = 0, lastDragY3D = 0;
            
            // ارتفاع چهاروجهی منتظم از روی ضلع: h = a * √(2/3)
            function getTetrahedronHeight(a) {
                return a * Math.sqrt(2/3);
            }
            
            // دریافت مقادیر ورودی (با پشتیبانی از چهاروجهی منتظم)
            function getValues() {
                let type = sidesSelect.value;
                let n;
                let a = parseFloat(sideInput.value);
                let h = parseFloat(heightInput.value);
                
                if (isNaN(a) || a <= 0) a = 6;
                
                if (type === 'tetra') {
                    n = 3;
                    const correctH = getTetrahedronHeight(a);
                    if (Math.abs(h - correctH) > 0.001 || isNaN(h) || h <= 0) {
                        h = correctH;
                        heightInput.value = h.toFixed(6);
                    }
                } else {
                    n = parseInt(type);
                    if (isNaN(n) || n < 3) n = 4;
                    if (isNaN(h) || h <= 0) h = 8;
                }
                
                const R = a / (2 * Math.sin(Math.PI / n));
                const L = Math.sqrt(h * h + R * R);
                
                return { n, a, h, L, R, isTetra: (type === 'tetra') };
            }
            
            // مساحت چندضلعی منتظم
            function polygonArea(n, a) {
                if (n < 3) return 0;
                return (n * a * a) / (4 * Math.tan(Math.PI / n));
            }
            
            // ارتفاع مثلث جانبی (با استفاده از یال و نصف ضلع قاعده)
            function getSlantHeight(L, a) {
                return Math.sqrt(L * L - (a/2) * (a/2));
            }
            
            // محاسبات مساحت و حجم
            function calculateAndUpdate() {
                let { n, a, h, L, R, isTetra } = getValues();
                const areaBase = polygonArea(n, a);
                const slantHeight = getSlantHeight(L, a);
                const lateralArea = n * 0.5 * a * slantHeight;
                const totalArea = areaBase + lateralArea;
                const volume = (1/3) * areaBase * h;
                
                totalAreaSpan.innerText = totalArea.toFixed(2);
                lateralAreaSpan.innerText = lateralArea.toFixed(2);
                volumeSpan.innerText = volume.toFixed(2);
                
                if (isTetra) {
                    dimensionsSpan.innerHTML = `چهاروجهی منتظم (همه وجه‌ها مثلث متساوی‌الاضلاع) | a=${a.toFixed(2)}, h=${h.toFixed(3)}`;
                } else {
                    dimensionsSpan.innerHTML = `n=${n}, a=${a.toFixed(2)}, h=${h.toFixed(2)}, یال جانبی=${L.toFixed(2)}`;
                }
                
                return { n, a, h, L, R, isTetra, areaBase, slantHeight };
            }
            
            function getCircumradius(a, n) {
                return a / (2 * Math.sin(Math.PI / n));
            }
            
            // رسم چندضلعی منتظم برای گسترده
            function drawRegularPolygon(ctx, cx, cy, n, R, rotationRad, fillColor, strokeColor) {
                if (n < 3) return;
                const vertices = [];
                for (let i = 0; i < n; i++) {
                    let angle = rotationRad + i * 2 * Math.PI / n;
                    let x = cx + R * Math.cos(angle);
                    let y = cy + R * Math.sin(angle);
                    vertices.push({ x, y });
                }
                ctx.beginPath();
                ctx.moveTo(vertices[0].x, vertices[0].y);
                for (let i = 1; i < n; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
                ctx.closePath();
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2;
                ctx.stroke();
                return vertices;
            }
            
            function getRotationAngle(n) {
                const baseAngle = -Math.PI / 2 + Math.PI / n;
                const extra = (n % 2 === 0) ? 0 : Math.PI;
                return baseAngle + extra;
            }
            
            // ========================== نمای گسترده (Net) ==========================
            function drawNet() {
                let { n, a, h, L, R, isTetra } = getValues();
                const width = canvas.width, height = canvas.height;
                ctx.clearRect(0, 0, width, height);
                
                // سایه ملایم
                ctx.beginPath();
                ctx.ellipse(width/2, height*0.72, width*0.15, height*0.045, 0, 0, Math.PI*2);
                const shadow = ctx.createRadialGradient(width/2, height*0.72, 5, width/2, height*0.72, width*0.15);
                shadow.addColorStop(0, "rgba(0,0,0,.35)");
                shadow.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = shadow;
                ctx.fill();
                
                const slantHeight = getSlantHeight(L, a);
                const R_base = getCircumradius(a, n);
                const baseDiameter = 2 * R_base;
                const totalApproxHeight = slantHeight * 2 + baseDiameter * 0.6;
                const totalApproxWidth = Math.max(a * n, baseDiameter * 1.5);
                const marginPercent = 0.12;
                const availableWidth = width * (1 - marginPercent * 2);
                const availableHeight = height * (1 - marginPercent * 2);
                
                let scale = Math.min(availableWidth / totalApproxWidth, availableHeight / totalApproxHeight);
                scale = Math.min(scale, 7);
                scale = Math.max(scale, 1.2);
                
                const centerX = width / 2 + netOffsetX;
                const centerY = height / 2 + netOffsetY;
                
                const baseColor = "rgba(255, 160, 80, 0.92)";
                const lateralColor = "rgba(74, 144, 226, 0.88)";
                const strokeLight = "#ffdd99";
                const rotation = getRotationAngle(n);
                const R_scaled = R_base * scale;
                const triangleHeightScaled = slantHeight * scale;
                
                const baseVertices = [];
                for (let i = 0; i < n; i++) {
                    let angle = rotation + i * 2 * Math.PI / n;
                    let x = centerX + R_scaled * Math.cos(angle);
                    let y = centerY + R_scaled * Math.sin(angle);
                    baseVertices.push({ x, y });
                }
                
                // رسم قاعده
                ctx.beginPath();
                ctx.moveTo(baseVertices[0].x, baseVertices[0].y);
                for (let i = 1; i < n; i++) ctx.lineTo(baseVertices[i].x, baseVertices[i].y);
                ctx.closePath();
                ctx.fillStyle = baseColor;
                ctx.fill();
                ctx.strokeStyle = strokeLight;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // رسم مثلث‌های جانبی
                for (let i = 0; i < n; i++) {
                    const p1 = baseVertices[i];
                    const p2 = baseVertices[(i + 1) % n];
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    const outDirX = midX - centerX;
                    const outDirY = midY - centerY;
                    const outLen = Math.sqrt(outDirX * outDirX + outDirY * outDirY);
                    const normOutX = outDirX / outLen;
                    const normOutY = outDirY / outLen;
                    const apexX = midX + normOutX * triangleHeightScaled;
                    const apexY = midY + normOutY * triangleHeightScaled;
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(apexX, apexY);
                    ctx.closePath();
                    ctx.fillStyle = lateralColor;
                    ctx.fill();
                    ctx.strokeStyle = strokeLight;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }
            
            // توابع سه بعدی
            function rotatePoint3D(x, y, z) {
                const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
                const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y2 = y * cosX - z1 * sinX;
                let z2 = y * sinX + z1 * cosX;
                return { x: x1, y: y2, z: z2 };
            }
            
            function projectPerspective(x, y, z, cx, cy, perspective = 1100) {
                const scale = perspective / (perspective + z);
                return { x: cx + x * scale, y: cy + y * scale, scale: scale };
            }
            
            function drawFace3D(points, fillStyle, strokeStyle, lineWidth = 1.5) {
                if (points.length < 3) return;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.closePath();
                ctx.fillStyle = fillStyle;
                ctx.fill();
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }
            
            // ========================== نمای ۳ بعدی با قاعده نارنجی پررنگ ==========================
            function draw3D() {
                let { n, a, h, L, R, isTetra } = getValues();
                const width = canvas.width, height = canvas.height;
                if (width <= 0 || height <= 0 || n < 3 || a <= 0 || h <= 0) return;
                
                const bg = ctx.createLinearGradient(0, 0, width, height);
                bg.addColorStop(0, '#12192f');
                bg.addColorStop(1, '#070b16');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, width, height);
                
                const cx = width / 2;
                const cy = height / 2 + 20;
                
                const shadowGrad = ctx.createRadialGradient(cx, height - 55, 0, cx, height - 55, 130);
                shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
                shadowGrad.addColorStop(0.45, 'rgba(0,0,0,0.20)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.ellipse(cx, height - 55, 130, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                
                const maxDim = Math.max(2 * R, h);
                let scale = Math.min(width, height) / (maxDim * 1.8);
                scale = Math.min(scale, 7);
                scale = Math.max(scale, 0.8);
                
                const rotAngle = getRotationAngle(n);
                const baseVertices3D = [];
                for (let i = 0; i < n; i++) {
                    const angle = rotAngle + i * 2 * Math.PI / n;
                    const x = R * Math.cos(angle) * scale;
                    const z = R * Math.sin(angle) * scale;
                    baseVertices3D.push({ x: x, y: 0, z: z });
                }
                const apex3D = { x: 0, y: -h * scale, z: 0 };
                
                const rotatedBase = baseVertices3D.map(p => rotatePoint3D(p.x, p.y, p.z));
                const rotatedApex = rotatePoint3D(apex3D.x, apex3D.y, apex3D.z);
                
                // پروجکشن موقت برای محاسبه bounding box
                const tempProjectedBase = rotatedBase.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 700));

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                const allTempPoints = [...tempProjectedBase, tempProjectedApex];
                for (const p of allTempPoints) {
                    minX = Math.min(minX, p.x);
                    maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y);
                    maxY = Math.max(maxY, p.y);
                }
                const projectedWidth = maxX - minX;
                const projectedHeight = maxY - minY;
                let fitScale = 1;
                const targetMargin = 0.78;
                if (projectedWidth > 0 && projectedHeight > 0) {
                    fitScale = Math.min((width * targetMargin) / projectedWidth, (height * targetMargin) / projectedHeight);
                }
                
                const finalRotatedBase = rotatedBase.map(p => ({ x: p.x * fitScale, y: p.y * fitScale, z: p.z }));
                const finalRotatedApex = { x: rotatedApex.x * fitScale, y: rotatedApex.y * fitScale, z: rotatedApex.z };
                
                const finalTempBase = finalRotatedBase.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 700));

                let finalMinX = Infinity, finalMaxX = -Infinity, finalMinY = Infinity, finalMaxY = -Infinity;
                const allFinalTemp = [...finalTempBase, finalTempApex];
                for (const p of allFinalTemp) {
                    finalMinX = Math.min(finalMinX, p.x);
                    finalMaxX = Math.max(finalMaxX, p.x);
                    finalMinY = Math.min(finalMinY, p.y);
                    finalMaxY = Math.max(finalMaxY, p.y);
                }
                const centerOffsetX = (width - (finalMinX + finalMaxX)) / 2;
                const verticalShift = 10;
                const centerOffsetY = (height - (finalMinY + finalMaxY)) / 2;
                
                const projectedBase = finalRotatedBase.map(p => projectPerspective(p.x, p.y, p.z, centerOffsetX, centerOffsetY + verticalShift, 700));
                const projectedApex = projectPerspective(finalRotatedApex.x, finalRotatedApex.y, finalRotatedApex.z, centerOffsetX, centerOffsetY + verticalShift, 700);
                
                const faces = [];
                for (let i = 0; i < n; i++) {

                    const p2 = projectedBase[(i + 1) % n];
                    const avgDepth = (finalRotatedBase[i].z + finalRotatedBase[(i + 1) % n].z + finalRotatedApex.z) / 3;
                    faces.push({
                        type: 'lateral',
                        points: [p1, p2, projectedApex],
                        depth: avgDepth,
                        index: i
                    });
                }
                const baseDepth = finalRotatedBase.reduce((sum, p) => sum + p.z, 0) / n;
                faces.push({
                    type: 'base',
                    points: projectedBase,
                    depth: baseDepth
                });
                
                faces.sort((a, b) => a.depth - b.depth);

                            face.points[0].x, face.points[0].y,
                            face.points[2].x, face.points[2].y

                            projectedBase[0]?.x || 0, projectedBase[0]?.y || 0,

                        );

                e.preventDefault();
            }
            
            function handle3DDragEnd() {
                isDragging3D = false;
                canvas.style.cursor = 'grab';
            }
            
            function handleNetDragStart(e) {

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX = clientX;

            function handleNetDragMove(e) {

                <div class="info-text"><span class="badge" id="viewLabel">✨ نمای گسترده | مقیاس هوشمند + درگ</span><span class="badge">🖱️ چرخش سه‌بعدی فعال</span><span class="badge">🔒 ضدخروج تضمینی</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const sidesSelect = document.getElementById('sidesCount');
        const sideInput = document.getElementById('sideLength');
        const heightInput = document.getElementById('height');
        const updateBtn = document.getElementById('updateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalAreaSpan = document.getElementById('totalArea');
        const lateralAreaSpan = document.getElementById('lateralArea');
        const volumeSpan = document.getElementById('volume');
        const dimensionsSpan = document.getElementById('dimensions');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const showNetBtn = document.getElementById('showNetBtn');
        const show3DBtn = document.getElementById('show3DBtn');
        const viewLabel = document.getElementById('viewLabel');

        let currentView = 'net';
        let netOffsetX = 0, netOffsetY = 0;
        let isDragging = false;
        let lastDragX = 0, lastDragY = 0;
        
        let rotationY = -0.65;
        let rotationX = 0.35;
        let isDragging3D = false;
        let lastDragX3D = 0, lastDragY3D = 0;

        function getValues() {
            let n = parseInt(sidesSelect.value);
            let a = parseFloat(sideInput.value);
            let h = parseFloat(heightInput.value);
            if (isNaN(n) || n < 3) n = 6;
            if (isNaN(a) || a <= 0) a = 4;
            if (isNaN(h) || h <= 0) h = 5;
            return { n, a, h };
        }

        function polygonArea(n, a) {
            if (n < 3) return 0;
            return (n * a * a) / (4 * Math.tan(Math.PI / n));
        }

        function calculateAndUpdate() {
            let { n, a, h } = getValues();
            const areaBase = polygonArea(n, a);
            const perimeter = n * a;
            const lateral = perimeter * h;
            const total = 2 * areaBase + lateral;
            const volume = areaBase * h;
            totalAreaSpan.innerText = total.toFixed(2);
            lateralAreaSpan.innerText = lateral.toFixed(2);
            volumeSpan.innerText = volume.toFixed(2);
            dimensionsSpan.innerText = `n=${n}, a=${a.toFixed(2)}, h=${h.toFixed(2)}`;
            return { n, a, h, areaBase, perimeter };
        }

        function getCircumradius(a, n) {
            return a / (2 * Math.sin(Math.PI / n));
        }

        function drawRegularPolygon(ctx, cx, cy, n, R, rotationRad, fillColor, strokeColor, lineW = 2) {
            if (n < 3) return;
            const vertices = [];
            for (let i = 0; i < n; i++) {
                let angle = rotationRad + i * 2 * Math.PI / n;
                let x = cx + R * Math.cos(angle);
                let y = cy + R * Math.sin(angle);
                vertices.push({ x, y });
            }
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let i = 1; i < n; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineW;
            ctx.stroke();
        }

        function getFinalRotation(n) {
            const baseAngle = -Math.PI / 2 + Math.PI / n;
            const extra = (n % 2 === 0) ? 0 : Math.PI;
            return baseAngle + extra;
        }

        // ======================== گسترده NET (مقیاس‌دهی اصلی بدون تغییر) ========================
        function drawNet() {
            let { n, a, h } = getValues();
            const width = canvas.width, height = canvas.height;
            ctx.clearRect(0, 0, width, height);
            if (width <= 0 || height <= 0) return;

            const R_base = getCircumradius(a, n);
            const apothem = R_base * Math.cos(Math.PI / n);
            const rectW = a;
            const rectH = h;
            const totalRectsWidth = n * rectW;
            const baseDiameter = 2 * R_base;

            const netPureWidth = totalRectsWidth + baseDiameter * 2;
            const netPureHeight = rectH + (2 * 2 * apothem);
            if (netPureWidth <= 0 || netPureHeight <= 0) return;

            // مقیاس‌دهی اصلی - بدون تغییر
            const marginRatio = 0.04;
            let scale = Math.min(
                (width * (1 - marginRatio * 2)) / netPureWidth,
                (height * (1 - marginRatio * 2)) / netPureHeight
            );
            scale = Math.min(scale, 5.5);
            scale = Math.max(scale, 0.45);

            const L = rectW * scale;
            const W = rectH * scale;
            const baseDiaScaled = baseDiameter * scale;
            const apothemScaled = apothem * scale;

            const totalDrawWidth = totalRectsWidth * scale + baseDiaScaled * 2;
            const totalDrawHeight = netPureHeight * scale;
            let startX = (width - totalDrawWidth) / 2 + baseDiaScaled + netOffsetX;
            let startY = (height - totalDrawHeight) / 2 + netOffsetY;

            const baseColor = "rgba(255, 175, 95, 0.92)";
            const strokeLight = "#ffe0aa";

            for (let i = 0; i < n; i++) {
                let x = startX + i * L;
                let y = startY + (totalDrawHeight - W) / 2;
                ctx.beginPath();
                ctx.rect(x, y, L, W);
                const grad = ctx.createLinearGradient(x, y, x + L, y + W);
                grad.addColorStop(0, "rgba(90, 190, 240, 0.9)");
                grad.addColorStop(1, "rgba(45, 125, 185, 0.85)");
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = strokeLight;
                ctx.lineWidth = 1.7;
                ctx.stroke();
            }

            const firstRectX = startX;
            const rectAreaY = startY + (totalDrawHeight - W) / 2;
            const rectCenterX = firstRectX + L / 2;
            const finalRotation = getFinalRotation(n);
            const R_scaled = R_base * scale;

            const topPolyCenterY = rectAreaY - apothemScaled;
            drawRegularPolygon(ctx, rectCenterX, topPolyCenterY, n, R_scaled, finalRotation, baseColor, strokeLight, 1.8);
            const bottomPolyCenterY = rectAreaY + W + apothemScaled;
            drawRegularPolygon(ctx, rectCenterX, bottomPolyCenterY, n, R_scaled, -finalRotation, baseColor, strokeLight, 1.8);
        }

        // ======================== توابع سه بعدی بدون پرسپکتیو (متعامد) ========================
        function rotatePoint3D(x, y, z) {
            const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
            let x1 = x * cosY + z * sinY;
            let z1 = -x * sinY + z * cosY;
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;
            return { x: x1, y: y2, z: z2 };
        }
        
        function orthoProject(point, cx, cy, scale = 1) {
            return {
                x: cx + point.x * scale,
                y: cy + point.y * scale
            };
        }
        
        function drawFace3D(points, fillStyle, strokeStyle, lineWidth = 1.2) {
            if (points.length < 3) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = strokeStyle;
            ctx.stroke();
        }
        
        // ======================== نمای سه‌بعدی متعامد با مقیاس‌دهی اصلی مشابه کد اولیه ========================
        function draw3D() {
            let { n, a, h } = getValues();
            const width = canvas.width, height = canvas.height;
            if (width <= 0 || height <= 0 || n < 3) return;
            
            ctx.clearRect(0, 0, width, height);
            
            // سایه زیر منشور (ظاهری)
            const cxCenter = width / 2;
            const shadowGrad = ctx.createRadialGradient(cxCenter, height - 50, 0, cxCenter, height - 50, 140);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
            shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.2)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(cxCenter, height - 50, width * 0.2, height * 0.07, 0, 0, Math.PI * 2);
            ctx.fill();
            
            const R = getCircumradius(a, n);
            const bottomVertices = [];
            const topVertices = [];
            for (let i = 0; i < n; i++) {
                const angle = i * 2 * Math.PI / n;
                const x = R * Math.cos(angle);
                const z = R * Math.sin(angle);
                bottomVertices.push({ x, y: 0, z });
                topVertices.push({ x, y: h, z });
            }
            
            let rotatedBottom = bottomVertices.map(v => rotatePoint3D(v.x, v.y, v.z));
            let rotatedTop = topVertices.map(v => rotatePoint3D(v.x, v.y, v.z));
            
            // مقیاس‌دهی اولیه بر اساس ابعاد مدل (مشابه کد اصلی اما بدون پرسپکتیو)
            let allPoints = [...rotatedBottom, ...rotatedTop];
            let maxX = -Infinity, minX = Infinity, maxY = -Infinity, minY = Infinity;
            for (let p of allPoints) {
                if (p.x > maxX) maxX = p.x;
                if (p.x < minX) minX = p.x;
                if (p.y > maxY) maxY = p.y;
                if (p.y < minY) minY = p.y;
            }
            const modelWidth = maxX - minX;
            const modelHeight = maxY - minY;
            const maxDim = Math.max(modelWidth, modelHeight);
            
            let baseScale = Math.min(width, height) / (maxDim * 2.2);
            baseScale = Math.min(baseScale, 5.8);
            baseScale = Math.max(baseScale, 0.6);
            
            // اعمال مقیاس
            let scaledBottom = rotatedBottom.map(p => ({ x: p.x * baseScale, y: p.y * baseScale, z: p.z }));
            let scaledTop = rotatedTop.map(p => ({ x: p.x * baseScale, y: p.y * baseScale, z: p.z }));
            
            // محاسبه باندینگ باکس برای فیت نهایی (بدون پرسپکتیو)
            let allScaled = [...scaledBottom, ...scaledTop];
            let minSX = Infinity, maxSX = -Infinity, minSY = Infinity, maxSY = -Infinity;
            for (let p of allScaled) {
                if (p.x < minSX) minSX = p.x;
                if (p.x > maxSX) maxSX = p.x;
                if (p.y < minSY) minSY = p.y;
                if (p.y > maxSY) maxSY = p.y;
            }
            const scaledWidth = maxSX - minSX;
            const scaledHeight = maxSY - minSY;
            const targetMargin = 0.86;
            let fitScale = 1;
            if (scaledWidth > 0 && scaledHeight > 0) {
                fitScale = Math.min(
                    (width * targetMargin) / scaledWidth,
                    (height * targetMargin) / scaledHeight
                );
                fitScale = Math.min(fitScale, 2.5);
                fitScale = Math.max(fitScale, 0.5);
            }
            
            // اعمال فیت اسکیل نهایی
            let finalScaledBottom = scaledBottom.map(p => ({ x: p.x * fitScale, y: p.y * fitScale, z: p.z }));
            let finalScaledTop = scaledTop.map(p => ({ x: p.x * fitScale, y: p.y * fitScale, z: p.z }));
            
            // محاسبه مجدد باندینگ باکس برای مرکزدهی
            let allFinal = [...finalScaledBottom, ...finalScaledTop];
            let finalMinX = Infinity, finalMaxX = -Infinity, finalMinY = Infinity, finalMaxY = -Infinity;
            for (let p of allFinal) {
                if (p.x < finalMinX) finalMinX = p.x;
                if (p.x > finalMaxX) finalMaxX = p.x;
                if (p.y < finalMinY) finalMinY = p.y;
                if (p.y > finalMaxY) finalMaxY = p.y;
            }
            const centerOffsetX = (width - (finalMinX + finalMaxX)) / 2;
            const verticalShift = 28;
            const centerOffsetY = (height - (finalMinY + finalMaxY)) / 2 + verticalShift;
            
            // پروجکشن نهایی (بدون پرسپکتیو)
            const projBottom = finalScaledBottom.map(p => ({ x: p.x + centerOffsetX, y: p.y + centerOffsetY }));
            const projTop = finalScaledTop.map(p => ({ x: p.x + centerOffsetX, y: p.y + centerOffsetY }));
            
            // ساخت وجوه
            const faces = [];
            for (let i = 0; i < n; i++) {
                const next = (i + 1) % n;
                const p1 = projBottom[i];
                const p2 = projBottom[next];
                const p3 = projTop[next];
                const p4 = projTop[i];
                const points = [p1, p2, p3, p4];
                const avgZ = (finalScaledBottom[i].z + finalScaledBottom[next].z + finalScaledTop[next].z + finalScaledTop[i].z) / 4;
                faces.push({ type: 'lateral', points: points, depth: avgZ, index: i });
            }
            const baseDepth = finalScaledBottom.reduce((sum, p) => sum + p.z, 0) / n;
            faces.push({ type: 'base', points: projBottom, depth: baseDepth });
            const topDepth = finalScaledTop.reduce((sum, p) => sum + p.z, 0) / n;
            faces.push({ type: 'top', points: projTop, depth: topDepth });
            
            faces.sort((a, b) => a.depth - b.depth);
            
            faces.forEach(face => {
                if (face.type === 'lateral') {
                    const grad = ctx.createLinearGradient(
                        face.points[0].x, face.points[0].y,
                        face.points[2].x, face.points[2].y
                    );
                    const idx = face.index;
                    grad.addColorStop(0, idx % 2 === 0 ? '#3b9eff' : '#5f7eff');
                    grad.addColorStop(0.7, '#1f3f7f');
                    drawFace3D(face.points, grad, 'rgba(255,245,190,0.4)', 1.3);
                } else if (face.type === 'base') {
                    drawFace3D(face.points, 'rgba(200, 145, 75, 0.92)', '#ffcf88', 1.5);
                } else if (face.type === 'top') {
                    const topGrad = ctx.createLinearGradient(centerOffsetX-30, centerOffsetY-70, centerOffsetX+30, centerOffsetY-20);
                    topGrad.addColorStop(0, 'rgba(250, 190, 100, 0.98)');
                    topGrad.addColorStop(1, 'rgba(220, 150, 70, 0.95)');
                    drawFace3D(face.points, topGrad, '#ffddbb', 1.6);
                }
            });
            
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = 'rgba(255,240,180,0.65)';
            for (let i = 0; i < n; i++) {
                ctx.beginPath();
                ctx.moveTo(projBottom[i].x, projBottom[i].y);
                ctx.lineTo(projTop[i].x, projTop[i].y);
                ctx.stroke();
            }
            
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const glow = ctx.createRadialGradient(centerOffsetX-15, centerOffsetY-70, 8, centerOffsetX, centerOffsetY-50, 130);
            glow.addColorStop(0, 'rgba(255,240,180,0.4)');
            glow.addColorStop(1, 'rgba(255,220,100,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(centerOffsetX-8, centerOffsetY-55, 80, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function refresh() {
            calculateAndUpdate();
            if (currentView === 'net') drawNet();
            else draw3D();
        }

        function setupCanvas() {
            const container = canvas.parentElement;
            if (!container) return;
            const containerWidth = container.clientWidth - 16;
            let newWidth = Math.min(containerWidth, 780);
            newWidth = Math.max(newWidth, 300);
            canvas.width = newWidth;
            canvas.height = Math.floor(newWidth * 0.68);
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            refresh();
        }
        
        function setView(view) {
            currentView = view;
            if (view === 'net') {
                showNetBtn.classList.add('btn-active');
                show3DBtn.classList.remove('btn-active');
                viewLabel.innerText = '🧩 گسترده (Net) | درگ کنید + مقیاس پویا';
                netOffsetX = 0;
                netOffsetY = 0;
                canvas.style.cursor = 'grab';
            } else {
                show3DBtn.classList.add('btn-active');
                showNetBtn.classList.remove('btn-active');
                viewLabel.innerText = '📦 نمای سه‌بعدی متعامد | چرخش با ماوس/لمس + بدون پرسپکتیو';
                canvas.style.cursor = 'grab';
            }
            refresh();
        }
        
        function handle3DDragStart(e) {
            if (currentView !== '3d') return;
            isDragging3D = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX3D = clientX;
            lastDragY3D = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }
        
        function handle3DDragMove(e) {
            if (!isDragging3D || currentView !== '3d') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - lastDragX3D;
            const dy = clientY - lastDragY3D;
            
            rotationY += dx * 0.008;
            rotationX += dy * 0.008;
            rotationX = Math.max(-1.57, Math.min(1.57, rotationX));
            
            lastDragX3D = clientX;
            lastDragY3D = clientY;
            draw3D();
            e.preventDefault();
        }
        
        function handle3DDragEnd() {
            isDragging3D = false;
            canvas.style.cursor = 'grab';
        }
        
        function onDragStart(e) {
            if (currentView !== 'net') return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastDragX = clientX;
            lastDragY = clientY;
            e.preventDefault();
            canvas.style.cursor = 'grabbing';
        }
        
        function onDragMove(e) {
            if (!isDragging || currentView !== 'net') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            netOffsetX += clientX - lastDragX;
            netOffsetY += clientY - lastDragY;
            
            // محدودیت درگ (همان کد اصلی)
            const limitX = canvas.width * 0.22;
            const limitY = canvas.height * 0.22;
            netOffsetX = Math.max(-limitX, Math.min(limitX, netOffsetX));
            netOffsetY = Math.max(-limitY, Math.min(limitY, netOffsetY));
            
            lastDragX = clientX;
            lastDragY = clientY;
            drawNet();
            e.preventDefault();
        }
        
        function onDragEnd() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }
        
        function onPointerDown(e) {
            if (currentView === 'net') onDragStart(e);
            else if (currentView === '3d') handle3DDragStart(e);
        }
        
        function onPointerMove(e) {
            if (currentView === 'net') onDragMove(e);
            else if (currentView === '3d') handle3DDragMove(e);
        }
        
        function onPointerUp(e) {
            if (currentView === 'net') onDragEnd(e);
            else if (currentView === '3d') handle3DDragEnd(e);
        }
        
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.style.cursor = 'grab';
        
        sidesSelect.addEventListener('change', refresh);
        sideInput.addEventListener('input', refresh);
        heightInput.addEventListener('input', refresh);
        updateBtn.addEventListener('click', refresh);
        resetBtn.addEventListener('click', () => {
            sidesSelect.value = "6";
            sideInput.value = "4";
            heightInput.value = "5";
            netOffsetX = 0;
            netOffsetY = 0;
            rotationY = -0.65;
            rotationX = 0.35;
            refresh();
        });
        showNetBtn.addEventListener('click', () => setView('net'));
        show3DBtn.addEventListener('click', () => setView('3d'));
        
        window.addEventListener('resize', () => setTimeout(setupCanvas, 80));
        setupCanvas();
        setView('net');
    })();
</script>
</body>
</html>
</template>

        .view-btn { flex: 1; padding: 6px; background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid rgba(255,255,255,0.3); font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .view-btn:hover { background: rgba(0, 0, 0, 0.7); }
        .results-panel { background: rgba(0, 0, 0, 0.45); border-radius: 12px; padding: 10px; margin-top: 10px; }
        .result-item { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .result-item:last-child { border-bottom: none; }
        .result-label { font-size: 12px; font-weight: 500; }
        .result-value { font-size: 16px; font-weight: bold; color: #ffd966; text-align: left; direction: ltr; }
        .formula-text { font-size: 9px; display: block; color: #ffd966aa; font-weight: normal; direction: rtl; text-align: left; }
        .unit { font-size: 9px; margin-right: 3px; }
        .drawing-panel { background: rgba(0, 0, 0, 0.35); border-radius: 16px; padding: 10px; }
        .canvas-container { background: #1a1a2e; border-radius: 12px; padding: 6px; display: flex; justify-content: center; align-items: center; min-height: 380px; position: relative; }
        #mainCanvas { background: linear-gradient(145deg, #16213e, #0f0f1a); border-radius: 10px; display: block; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%; height: auto; cursor: grab; transition: all 0.2s; }
        #mainCanvas:active { cursor: grabbing; }
        .info-text { color: rgba(255, 255, 255, 0.7); text-align: center; margin-top: 8px; font-size: 9px; }
        .badge { background: rgba(255, 217, 102, 0.2); padding: 2px 6px; border-radius: 15px; font-size: 9px; display: inline-block; }
        @media (max-width: 768px) { .two-columns { grid-template-columns: 1fr; gap: 12px; } body { padding: 6px; } h1 { font-size: 18px; } .canvas-container { min-height: 340px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 محاسبه‌گر مکعب مستطیل | گسترده استاندارد + سه‌بعدی</h1>
        <div class="main-card">
            <div class="two-columns">
                <div class="input-panel">
                    <div class="input-group"><label>📏 طول (Length) - ضلع جلو</label><input type="number" id="length" value="5" step="any"></div>
                    <div class="input-group"><label>📐 عرض (Width) - ضلع کنار</label><input type="number" id="width" value="6" step="any"></div>
                    <div class="input-group"><label>📏 ارتفاع (Height)</label><input type="number" id="height" value="6" step="any"></div>
                    <div class="btn-group"><button id="updateBtn" class="btn-primary">✨ بروزرسانی</button><button id="resetBtn" class="btn-secondary">🔄 بازنشانی</button></div>
                    <div class="results-panel">
                        <div class="result-item"><span class="result-label">🧮 مساحت کل</span><span class="result-value"><span id="totalArea">0</span><span class="unit">cm²</span><span class="formula-text">(۲ × (l×w + w×h + l×h))</span></span></div>
                        <div class="result-item"><span class="result-label">📐 مساحت جانبی</span><span class="result-value"><span id="lateralArea">0</span><span class="unit">cm²</span><span class="formula-text">(۲ × h × (l + w))</span></span></div>
                        <div class="result-item"><span class="result-label">💧 حجم</span><span class="result-value"><span id="volume">0</span><span class="unit">cm³</span><span class="formula-text">(l × w × h)</span></span></div>
                        <div class="result-item"><span class="result-label">🔍 ابعاد</span><span class="result-value" style="font-size: 13px;"><span id="dimensions">5 × 6 × 6</span></span></div>
                    </div>
                    <div class="info-text">⚡ گسترده استاندارد: بالا و پایین به جلو متصل هستند</div>
                </div>
                <div class="drawing-panel">
                    <div class="view-toggle"><button id="showNetBtn" class="view-btn btn-active">🧩 گسترده (Net) استاندارد</button><button id="show3DBtn" class="view-btn">📦 حجم سه‌بعدی (چرخش با ماوس)</button></div>
                    <div class="canvas-container"><canvas id="mainCanvas" width="550" height="450"></canvas></div>
                    <div class="info-text"><span class="badge" id="viewLabel">گسترده استاندارد مکعب | بالا↗️ و پایین↙️ به جلو متصل</span><span class="badge" style="margin-right:5px;">✨ مقیاس هوشمند + ضدخروج</span><span class="badge">🖱️ چرخش سه‌بعدی فعال</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const lengthInput = document.getElementById('length');
            const widthInput = document.getElementById('width');
            const heightInput = document.getElementById('height');
            const updateBtn = document.getElementById('updateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const totalAreaSpan = document.getElementById('totalArea');
            const lateralAreaSpan = document.getElementById('lateralArea');
            const volumeSpan = document.getElementById('volume');
            const dimensionsSpan = document.getElementById('dimensions');
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const showNetBtn = document.getElementById('showNetBtn');
            const show3DBtn = document.getElementById('show3DBtn');
            const viewLabel = document.getElementById('viewLabel');
            
            let currentView = 'net';
            let netOffsetX = 0, netOffsetY = 0;
            let isDragging = false;
            let lastDragX = 0, lastDragY = 0;
            
            let rotationY = -0.65;
            let rotationX = 0.35;
            let isDragging3D = false;
            let lastDragX3D = 0, lastDragY3D = 0;
            
            function getValues() {
                let l = parseFloat(lengthInput.value);
                let w = parseFloat(widthInput.value);
                let h = parseFloat(heightInput.value);
                if (isNaN(l)) l = 5;
                if (isNaN(w)) w = 6;
                if (isNaN(h)) h = 6;
                if (l < 0.01) l = 0.01;
                if (w < 0.01) w = 0.01;
                if (h < 0.01) h = 0.01;
                return { l, w, h };
            }
            
            function calculateAndUpdate() {
                let { l, w, h } = getValues();
                const totalArea = 2 * (l * w + w * h + l * h);
                const lateralArea = 2 * h * (l + w);
                const volume = l * w * h;
                totalAreaSpan.innerText = totalArea.toFixed(2);
                lateralAreaSpan.innerText = lateralArea.toFixed(2);
                volumeSpan.innerText = volume.toFixed(2);
                dimensionsSpan.innerText = `${l.toFixed(2)} × ${w.toFixed(2)} × ${h.toFixed(2)}`;
                return { l, w, h };
            }
            
            // ======================== گسترده استاندارد مکعب ========================
            // آرایش استاندارد:
            //        [ بالا (l × w) ]
            // [ چپ (w × h) ] [ جلو (l × h) ] [ راست (w × h) ] [ عقب (l × h) ]
            //        [ پایین (l × w) ]
            function drawNet() {
                let { l, w, h } = getValues();
                const width = canvas.width, height = canvas.height;
                ctx.clearRect(0, 0, width, height);
                if (width <= 0 || height <= 0) return;
                
                // ابعاد هر وجه پس از مقیاس‌گذاری
                const faceLW = l;  // طول در عرض (برای بالا و پایین)
                const faceLH = l;  // طول در ارتفاع (برای جلو و عقب)
                const faceWH = w;  // عرض در ارتفاع (برای چپ و راست)
                
                // عرض کل گسترده: 4 وجه در ردیف وسط: چپ + جلو + راست + عقب
                const totalNetWidth = w + l + w + l;  // = 2l + 2w
                // ارتفاع کل گسترده: بالا + جلو + پایین (چون بالا و پایین به جلو متصلند)
                const totalNetHeight = w + h + w;     // = 2w + h (بالا به ارتفاع w، جلو به ارتفاع h، پایین به ارتفاع w)
                
                const marginPercent = 0.08;
                const availableWidth = width * (1 - marginPercent * 2);
                const availableHeight = height * (1 - marginPercent * 2);
                
                let scale = Math.min(
                    availableWidth / totalNetWidth,
                    availableHeight / totalNetHeight
                );
                scale = Math.min(scale, 35);
                scale = Math.max(scale, 2);
                
                const L = l * scale;  // طول (بعد افقی وجه جلو)
                const W = w * scale;  // عرض (بعد افقی وجه کناری)
                const H = h * scale;  // ارتفاع (بعد عمودی وجه جلو)
                
                // محاسبه نقطه شروع (بالا-چپ گسترده) با احتساب درگ
                const totalDrawWidth = 2 * L + 2 * W;
                const totalDrawHeight = 2 * W + H;
                
                let startX = (width - totalDrawWidth) / 2 + netOffsetX;
                let startY = (height - totalDrawHeight) / 2 + netOffsetY;
                
                // مختصات ردیف وسط (جلو، چپ، راست، عقب)
                // ترتیب از چپ به راست: چپ (w×h) | جلو (l×h) | راست (w×h) | عقب (l×h)
                const leftX = startX;
                const frontX = startX + W;
                const rightX = startX + W + L;
                const backX = startX + W + L + W;
                
                const middleY = startY + W;  // ردیف وسط (چون بالا به ارتفاع W است)
                
                // مختصات بالا (بالای وجه جلو)
                const topX = frontX;
                const topY = startY;
                
                // مختصات پایین (پایین وجه جلو)
                const bottomX = frontX;
                const bottomY = middleY + H;
                
                const areas = { 
                    frontBack: l * h, 
                    rightLeft: w * h, 
                    topBottom: l * w 
                };
                
                const colors = { 
                    frontBack: 'rgba(74, 144, 226, 0.85)', 
                    rightLeft: 'rgba(80, 200, 120, 0.85)', 
                    topBottom: 'rgba(255, 160, 80, 0.85)' 
                };
                
                function drawFace(x, y, wd, ht, color, area, name) {
                    if (wd <= 0 || ht <= 0) return;
                    ctx.beginPath();
                    ctx.rect(x, y, wd, ht);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = '#ffcc77';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    const fontSize = Math.max(9, Math.min(14, wd / 7));
                    ctx.font = `bold ${fontSize}px "Segoe UI"`;
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(area.toFixed(1), x + wd/2, y + ht/2);
                    
                    ctx.font = `8px "Segoe UI"`;
                    ctx.fillStyle = '#ffddaa';
                    ctx.fillText(name, x + wd/2, y + ht - 4);
                }
                
                // ردیف وسط: چپ، جلو، راست، عقب
                drawFace(leftX, middleY, W, H, colors.rightLeft, areas.rightLeft, "چپ");     // چپ
                drawFace(frontX, middleY, L, H, colors.frontBack, areas.frontBack, "جلو");   // جلو
                drawFace(rightX, middleY, W, H, colors.rightLeft, areas.rightLeft, "راست");  // راست
                drawFace(backX, middleY, L, H, colors.frontBack, areas.frontBack, "عقب");    // عقب
                
                // بالا (متصل به بالای جلو)
                drawFace(topX, topY, L, W, colors.topBottom, areas.topBottom, "بالا");
                
                // پایین (متصل به پایین جلو)
                drawFace(bottomX, bottomY, L, W, colors.topBottom, areas.topBottom, "پایین");
                
                ctx.textAlign = 'left';
            }
            
            // ======================== توابع سه بعدی ========================
            function rotatePoint3D(x, y, z) {
                const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
                const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
                
                let x1 = x * cosY + z * sinY;
                let z1 = -x * sinY + z * cosY;
                let y2 = y * cosX - z1 * sinX;
                let z2 = y * sinX + z1 * cosX;
                
                return { x: x1, y: y2, z: z2 };
            }
            
            function projectPerspective(x, y, z, cx, cy, perspective = 900) {
                const scale = perspective / (perspective + z);
                return { x: cx + x * scale, y: cy + y * scale };
            }
            
            function drawFace3D(points, fillStyle, strokeStyle, lineWidth = 1.2) {
                if (points.length < 3) return;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = fillStyle;
                ctx.fill();
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }
            
            function draw3D() {
                let { l, w, h } = getValues();
                const width = canvas.width, height = canvas.height;
                if (width <= 0 || height <= 0) return;
                
                const bgGrad = ctx.createLinearGradient(0, 0, width, height);
                bgGrad.addColorStop(0, '#12192f');
                bgGrad.addColorStop(1, '#070b16');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);
                
                const shadowGrad = ctx.createRadialGradient(width/2, height - 40, 0, width/2, height - 40, 140);
                shadowGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
                shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.2)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.ellipse(width/2, height - 45, width * 0.2, height * 0.07, 0, 0, Math.PI * 2);
                ctx.fill();
                
                const halfL = l / 2;
                const halfW = w / 2;
                const halfH = h / 2;
                
                const localVertices = [
                    { x: -halfL, y: -halfH, z: -halfW },
                    { x:  halfL, y: -halfH, z: -halfW },
                    { x: -halfL, y: -halfH, z:  halfW },
                    { x:  halfL, y: -halfH, z:  halfW },
                    { x: -halfL, y:  halfH, z: -halfW },
                    { x:  halfL, y:  halfH, z: -halfW },
                    { x: -halfL, y:  halfH, z:  halfW },
                    { x:  halfL, y:  halfH, z:  halfW }
                ];
                
                let rotatedVertices = localVertices.map(v => rotatePoint3D(v.x, v.y, v.z));
                
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (let p of rotatedVertices) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                }
                
                const modelWidth = maxX - minX;
                const modelHeight = maxY - minY;
                const maxDim = Math.max(modelWidth, modelHeight);
                
                let baseScale = Math.min(width, height) / (maxDim * 2.2);
                baseScale = Math.min(baseScale, 18);
                baseScale = Math.max(baseScale, 2.5);
                
                let scaledVertices = rotatedVertices.map(p => ({ x: p.x * baseScale, y: p.y * baseScale, z: p.z }));
                
                let tempProjected = scaledVertices.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 900));
                let tempMinX = Infinity, tempMaxX = -Infinity, tempMinY = Infinity, tempMaxY = -Infinity;
                for (let p of tempProjected) {
                    if (p.x < tempMinX) tempMinX = p.x;
                    if (p.x > tempMaxX) tempMaxX = p.x;
                    if (p.y < tempMinY) tempMinY = p.y;
                    if (p.y > tempMaxY) tempMaxY = p.y;
                }
                
                const projWidth = tempMaxX - tempMinX;
                const projHeight = tempMaxY - tempMinY;
                let fitScale = 1;
                if (projWidth > 0 && projHeight > 0) {
                    const targetMargin = 0.85;
                    fitScale = Math.min(
                        (width * targetMargin) / projWidth,
                        (height * targetMargin) / projHeight
                    );
                    fitScale = Math.min(fitScale, 2.8);
                    fitScale = Math.max(fitScale, 0.45);
                }
                
                let finalScaledVertices = scaledVertices.map(p => ({ x: p.x * fitScale, y: p.y * fitScale, z: p.z }));
                
                let finalProjected = finalScaledVertices.map(p => projectPerspective(p.x, p.y, p.z, 0, 0, 900));
                let finalMinX = Infinity, finalMaxX = -Infinity, finalMinY = Infinity, finalMaxY = -Infinity;
                for (let p of finalProjected) {
                    if (p.x < finalMinX) finalMinX = p.x;
                    if (p.x > finalMaxX) finalMaxX = p.x;
                    if (p.y < finalMinY) finalMinY = p.y;
                    if (p.y > finalMaxY) finalMaxY = p.y;
                }
                
                const centerOffsetX = (width - (finalMinX + finalMaxX)) / 2;
                const verticalShift = 25;
                const centerOffsetY = (height - (finalMinY + finalMaxY)) / 2 + verticalShift;
                
                const projectedVertices = finalScaledVertices.map(p => 
                    projectPerspective(p.x, p.y, p.z, centerOffsetX, centerOffsetY, 900)
                );
                
                const faces = [
                    { indices: [0, 1, 5, 4], color: 'rgba(74, 144, 226, 0.88)', name: 'front' },
                    { indices: [2, 3, 7, 6], color: 'rgba(100, 100, 200, 0.75)', name: 'back' },
                    { indices: [0, 2, 6, 4], color: 'rgba(80, 180, 100, 0.85)', name: 'left' },
                    { indices: [1, 3, 7, 5], color: 'rgba(60, 160, 110, 0.85)', name: 'right' },
                    { indices: [4, 5, 7, 6], color: 'rgba(255, 160, 80, 0.92)', name: 'top' },
                    { indices: [0, 1, 3, 2], color: 'rgba(50, 50, 70, 0.8)', name: 'bottom' }
                ];
                
                const facesWithDepth = faces.map(face => {
                    let avgZ = 0;
                    for (let idx of face.indices) {
                        avgZ += finalScaledVertices[idx].z;
                    }
                    avgZ /= face.indices.length;
                    return { ...face, depth: avgZ };
                });
                
                facesWithDepth.sort((a, b) => a.depth - b.depth);
                
                facesWithDepth.forEach(face => {
                    const points = face.indices.map(idx => projectedVertices[idx]);
                    let fillColor = face.color;
                    if (face.name === 'top') {
                        const grad = ctx.createLinearGradient(points[0].x, points[0].y, points[2].x, points[2].y);
                        grad.addColorStop(0, '#ffb347');
                        grad.addColorStop(1, '#ff8c1a');
                        fillColor = grad;
                    } else if (face.name === 'front') {
                        const grad = ctx.createLinearGradient(points[0].x, points[0].y, points[2].x, points[2].y);
                        grad.addColorStop(0, '#5a9ad0');
                        grad.addColorStop(1, '#3a7ab0');
                        fillColor = grad;
                    } else if (face.name === 'right') {
                        const grad = ctx.createLinearGradient(points[0].x, points[0].y, points[2].x, points[2].y);
                        grad.addColorStop(0, '#4a9a6a');
                        grad.addColorStop(1, '#3a7a5a');
                        fillColor = grad;
                    }
                    drawFace3D(points, fillColor, 'rgba(255,220,150,0.5)', 1.3);
                });
                
                const edges = [
                    [0,1], [1,3], [3,2], [2,0],
                    [4,5], [5,7], [7,6], [6,4],
                    [0,4], [1,5], [2,6], [3,7]
                ];
                
                ctx.lineWidth = 1.8;
                ctx.strokeStyle = 'rgba(255,240,180,0.7)';
                for (let edge of edges) {
                    ctx.beginPath();
                    ctx.moveTo(projectedVertices[edge[0]].x, projectedVertices[edge[0]].y);
                    ctx.lineTo(projectedVertices[edge[1]].x, projectedVertices[edge[1]].y);
                    ctx.stroke();
                }
                
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const topCenter = projectedVertices[4];
                const glow = ctx.createRadialGradient(topCenter.x - 10, topCenter.y - 15, 5, topCenter.x, topCenter.y - 10, 100);
                glow.addColorStop(0, 'rgba(255,240,180,0.35)');
                glow.addColorStop(1, 'rgba(255,220,100,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(topCenter.x - 5, topCenter.y - 20, 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            function refresh() { 
                calculateAndUpdate(); 
                if (currentView === 'net') drawNet(); 
                else draw3D(); 
            }
            
            function setupCanvas() { 
                const container = canvas.parentElement; 
                if (!container) return;
                const containerWidth = container.clientWidth - 12; 
                let newWidth = Math.min(containerWidth, 580);
                newWidth = Math.max(newWidth, 300);
                canvas.width = newWidth; 
                canvas.height = Math.floor(newWidth * 0.78); 
                canvas.style.width = `${canvas.width}px`; 
                canvas.style.height = `${canvas.height}px`; 
                refresh(); 
            }
            
            function setView(view) { 
                currentView = view; 
                if (view === 'net') { 
                    showNetBtn.classList.add('btn-active'); 
                    show3DBtn.classList.remove('btn-active'); 
                    viewLabel.innerText = 'گسترده استاندارد | بالا↗️ و پایین↙️ به جلو متصل'; 
                    canvas.style.cursor = 'grab';
                    netOffsetX = 0;
                    netOffsetY = 0;
                } else { 
                    show3DBtn.classList.add('btn-active'); 
                    showNetBtn.classList.remove('btn-active'); 
                    viewLabel.innerText = 'نمایش حجم سه بعدی | چرخش با ماوس/لمس'; 
                    canvas.style.cursor = 'grab';
                } 
                refresh(); 
            }
            
            function handle3DDragStart(e) {
                if (currentView !== '3d') return;
                isDragging3D = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX3D = clientX;
                lastDragY3D = clientY;
                e.preventDefault();
                canvas.style.cursor = 'grabbing';
            }
            
            function handle3DDragMove(e) {
                if (!isDragging3D || currentView !== '3d') return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - lastDragX3D;
                const dy = clientY - lastDragY3D;
                
                rotationY += dx * 0.008;
                rotationX += dy * 0.008;
                rotationX = Math.max(-1.3, Math.min(1.3, rotationX));
                
                lastDragX3D = clientX;
                lastDragY3D = clientY;
                draw3D();
                e.preventDefault();
            }
            
            function handle3DDragEnd() {
                isDragging3D = false;
                canvas.style.cursor = 'grab';
            }
            
            function onDragStart(e) {
                if (currentView !== 'net') return;
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastDragX = clientX;
                lastDragY = clientY;
                e.preventDefault();

            }
            
            function onDragMove(e) {
                if (!isDragging || currentView !== 'net') return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                netOffsetY += clientY - lastDragY;
                lastDragX = clientX;
                lastDragY = clientY;

                e.preventDefault();
            }
            
            function onDragEnd() {

                canvas.style.cursor = 'grab';

                else if (currentView === '3d') handle3DDragStart(e);

            function onPointerMove(e) {
                if (currentView === 'net') onDragMove(e);
                else if (currentView === '3d') handle3DDragMove(e);
            }
            
            function onPointerUp(e) {
                if (currentView === 'net') onDragEnd(e);
                else if (currentView === '3d') handle3DDragEnd(e);
            }

            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('touchcancel', onPointerUp);
            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            widthInput.addEventListener('input', refresh);
